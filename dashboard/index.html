<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091017">
  <meta name="description" content="NBA projections, exact sportsbook quotes, and transparent forward-test results.">
  <title>NBA Model · Daily workspace</title>
  <style>__DASHBOARD_CSS__</style>
  <script id="dashboard-data">const DATA = __DASHBOARD_DATA__; window.DATA = DATA;</script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to dashboard</a>
  <div class="shell">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">◉</span><div><div class="eyebrow">BASKETBALL INTELLIGENCE</div><div class="brand-name">NBA <span>Model</span></div></div></div>
      <details class="more-menu"><summary aria-label="More dashboard options">•••</summary><div class="menu-panel">
        <button type="button" data-action="model-status">Model status &amp; validation</button>
        <button type="button" data-action="linemate-review">Linemate research workspace</button>
        <a id="historical-market-research-link" href="market-research/index.html">Historical market research<span>Research only · No live recommended bets</span></a>
      </div></details>
    </header>
    <div id="slate-freshness" class="freshness" role="status"></div>
    <section class="summary-strip" id="summary-strip" aria-label="Slate summary"></section>
    <nav class="tabs" aria-label="Dashboard sections" role="tablist">
      <button id="tab-today" role="tab" aria-selected="true" aria-controls="view" data-tab="today">Today</button>
      <button id="tab-games" role="tab" aria-selected="false" aria-controls="view" tabindex="-1" data-tab="games">Games</button>
      <button id="tab-props" role="tab" aria-selected="false" aria-controls="view" tabindex="-1" data-tab="props">Props</button>
      <button id="tab-results" role="tab" aria-selected="false" aria-controls="view" tabindex="-1" data-tab="results">Results</button>
    </nav>
    <main id="view" role="tabpanel" aria-labelledby="tab-today" tabindex="0"></main>
    <footer class="footer"><span class="status-dot"></span>Forward testing · All times Eastern<span>Exact sportsbook quotes · Recorded snapshots</span></footer>
  </div>
  <noscript><p class="no-script">Enable JavaScript to view projections and filters. Awaiting today’s predictions if no current slate is published.</p></noscript>
  <script>__LINEMATE_REVIEW_JS__
__DASHBOARD_JS__</script>
</body>
</html>
