name: Jev Generic Blind Runner

on:
  push:
    paths:
      - 'experiments/wnba_jev_blind/request.json'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve request
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("experiments/wnba_jev_blind/request.json").read_text())
          for key, env in [("date","TARGET"),("input","INPUT"),("truth","TRUTH"),("tag","TAG")]:
              val=str(d.get(key) or "")
              if not val:
                  raise SystemExit(f"Missing request field: {key}")
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write(f"{env}={val}\n")
          PY

      - name: Verify TypeSafe key
        run: |
          test -n "$TYPESAFE_API_KEY" || (echo "TYPESAFE_API_KEY missing" && exit 1)

      - name: Freeze Jev decisions before grading
        run: |
          python jev_shadow.py             --league wnba             --date "$TARGET"             --input "$INPUT"             --output "experiments/wnba_jev_blind/jev_shadow_v2_${TAG}.json"             --ledger "experiments/wnba_jev_blind/jev_shadow_ledger.jsonl"             --max-candidates 20

      - name: Grade frozen decisions
        run: |
          python grade_jev_historical.py             --shadow "experiments/wnba_jev_blind/jev_shadow_v2_${TAG}.json"             --truth "$TRUTH"             --output "experiments/wnba_jev_blind/grade_v2_${TAG}.json"

      - name: Publish experiment
        run: |
          git config user.name "Jev Experiment Bot"
          git config user.email "actions@github.com"
          git add experiments/wnba_jev_blind/
          git diff --cached --quiet || git commit -m "Jev blind experiment — $TARGET"
          git push
