name: NBA V1 Pre-Tip Refresh

concurrency:
  group: nba-model-publish
  cancel-in-progress: false

on:
  schedule:
    - cron: '5,35 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/pretip-trigger'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Eastern slate date (YYYY-MM-DD); blank=today'
        required: false
        default: ''

jobs:
  pretip-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      MIN_TO_TIP: '35'
      MAX_TO_TIP: '70'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set Eastern slate date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(python active_slate_date.py)
          fi
          echo "TARGET=$TARGET" >> $GITHUB_ENV

      - name: Check for games in pre-tip window
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os, requests
          from datetime import datetime, timezone

          target=os.environ["TARGET"]
          r=requests.get(
              "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",
              params={"dates": target.replace("-",""), "limit": 30},
              timeout=15,
          )
          r.raise_for_status()
          now=datetime.now(timezone.utc)
          lo=float(os.environ["MIN_TO_TIP"])
          hi=float(os.environ["MAX_TO_TIP"])
          eligible=[]
          for event in r.json().get("events",[]):
              raw=event.get("date")
              try:
                  tip=datetime.fromisoformat(str(raw).replace("Z","+00:00")).astimezone(timezone.utc)
              except Exception:
                  continue
              mins=(tip-now).total_seconds()/60.0
              if lo <= mins <= hi:
                  eligible.append((event.get("name"), round(mins,1)))
          print("ELIGIBLE=" + ("true" if eligible else "false"))
          print("ELIGIBLE_COUNT=" + str(len(eligible)))
          print("ELIGIBLE_GAMES=" + "|".join(f"{name}:{mins}m" for name,mins in eligible))
          PY

      - name: No near-tip games
        if: env.ELIGIBLE != 'true'
        run: echo "No NBA games between ${{ env.MIN_TO_TIP }} and ${{ env.MAX_TO_TIP }} minutes from tip; no Odds API credits used."

      - name: Refresh FD DK Fanatics game odds
        if: env.ELIGIBLE == 'true'
        run: python scrape_odds.py --date ${{ env.TARGET }} --out data/raw

      - name: Refresh near-tip FD DK Fanatics props
        if: env.ELIGIBLE == 'true'
        run: |
          python scrape_sportsbook_props.py \
            --date ${{ env.TARGET }} \
            --out data/raw \
            --min-minutes-to-tip ${{ env.MIN_TO_TIP }} \
            --max-minutes-to-tip ${{ env.MAX_TO_TIP }}

      - name: Refresh injuries
        if: env.ELIGIBLE == 'true'
        run: python scrape_injuries.py --date ${{ env.TARGET }} --out data/raw
        continue-on-error: true

      - name: Recompute opportunity redistribution
        if: env.ELIGIBLE == 'true'
        run: python opportunity_redistribution.py --date ${{ env.TARGET }} --out data/raw
        continue-on-error: true

      - name: Generate near-tip predictions
        if: env.ELIGIBLE == 'true'
        run: |
          python daily_runner.py \
            --date ${{ env.TARGET }} \
            --min-minutes-to-tip ${{ env.MIN_TO_TIP }} \
            --max-minutes-to-tip ${{ env.MAX_TO_TIP }} \
            --out predictions/pretip_${{ env.TARGET }}.json

      - name: Append near-tip execution snapshot
        if: env.ELIGIBLE == 'true'
        run: |
          python execution_ledger.py \
            --date ${{ env.TARGET }} \
            --predictions predictions/pretip_${{ env.TARGET }}.json

      - name: Preserve first-observed forward evidence
        if: env.ELIGIBLE == 'true'
        run: |
          python forward_ledger.py \
            --date ${{ env.TARGET }} \
            --predictions predictions/pretip_${{ env.TARGET }}.json

      - name: Publish pre-tip evidence
        if: env.ELIGIBLE == 'true'
        run: |
          git config user.name "NBA Model Bot"
          git config user.email "actions@github.com"
          git add \
            data/raw/odds_today.csv \
            data/raw/odds_${{ env.TARGET }}.csv \
            data/raw/odds_api_status.json \
            data/raw/sportsbook_props_today.csv \
            data/raw/sportsbook_props_${{ env.TARGET }}.csv \
            data/raw/sportsbook_props_status.json \
            data/raw/injuries_today.csv \
            data/raw/injuries_${{ env.TARGET }}.csv \
            data/raw/injuries_status.json \
            data/raw/opportunity_adjustments_today.csv \
            data/raw/opportunity_adjustments_${{ env.TARGET }}.csv \
            data/raw/opportunity_redistribution_status.json \
            predictions/pretip_${{ env.TARGET }}.json \
            data/history/nba_forward_predictions.jsonl \
            data/history/nba_pretip_execution_snapshots.jsonl \
            data/tracking/forward_ledger_status.json \
            data/tracking/execution_ledger_status.json
          git diff --cached --quiet || git commit -m "⏱️ NBA pre-tip refresh — ${{ env.TARGET }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase -X theirs origin/main
          git push
