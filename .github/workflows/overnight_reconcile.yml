name: NBA V1 Overnight Evidence Reconcile

concurrency:
  group: nba-model-publish
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - '.github/reconcile-refresh-trigger'
  schedule:
    # 3:00 AM ET (08:00 UTC in EST; 4 AM during EDT) with a 6:15 AM ET retry. Late West
    # games are final by then. GitHub runs these late, so a 3:00 AM ET workflow_dispatch from
    # a scheduled task is the primary start; these crons are the backstop.
    - cron: '0 8 * * *'
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Eastern slate date (YYYY-MM-DD); blank=yesterday ET'
        required: false
        default: ''

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set target Eastern slate date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET="${{ github.event.inputs.date }}"
          else
            TARGET=$(python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("America/New_York"))
          print((now.date()-timedelta(days=1)).isoformat())
          PY
          )
          fi
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "Reconciling $TARGET"

      - name: Reconcile slate and retry pending dates independently
        run: python reconcile_pending.py --date ${{ env.TARGET }} --max-backlog 3

      - name: Grade Monte Carlo shadow forecasts and V2 projections
        run: |
          python -m v2.simulation.shadow grade
          python -m v2.compare
          python data_bets_report.py
          python game_predictions_report.py
        continue-on-error: true

      - name: Print evidence summary
        run: |
          python - <<'PY'
          import json
          for p in [
              "data/tracking/nba_forward_performance.json",
              "data/tracking/nba_execution_performance.json",
              "data/tracking/nba_prop_clv_report.json",
              "data/tracking/nba_v1_readiness.json",
          ]:
              print("\n==",p,"==")
              try:
                  print(json.dumps(json.load(open(p)),indent=2))
              except Exception as exc:
                  print("unavailable:",exc)
          PY

      - name: Publish graded evidence
        run: |
          git config user.name "NBA Model Bot"
          git config user.email "actions@github.com"
          for f in data/raw/scores*.csv data/raw/result*.csv data/tracking data/history/nba_forward_predictions.jsonl models/edge_calibration.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "✅ NBA overnight evidence reconcile — ${{ env.TARGET }}"
          git reset --hard HEAD
          git clean -fd
          # The dashboard is rebuilt only after syncing with main: this run's checkout can
          # predate a newer daily update (GitHub starts schedules hours late), and committing
          # a dashboard built from it replaced the 2026-11-15 slate with "awaiting predictions".
          publish() {
            git fetch origin main
            git rebase -X theirs origin/main || return 1
            TARGET=$(python active_slate_date.py) python build_dashboard.py
            git add docs/index.html
            git diff --cached --quiet || git commit -m "Dashboard refresh after reconcile — ${{ env.TARGET }}"
            git push
          }
          publish || { git rebase --abort 2>/dev/null; git reset --hard HEAD; publish; }
