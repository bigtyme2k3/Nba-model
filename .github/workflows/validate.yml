name: NBA Architecture Validation

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Import core NBA pipeline
        run: |
          python - <<'PY'
          import build_player_features
          import props_model
          import daily_runner
          import results_tracker
          print("Core NBA modules import successfully")
          PY
