name: NBA Architecture Validation

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run NBA V1 compatibility and historical research tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Import core NBA pipeline
        run: |
          python - <<'PY'
          import build_player_features
          import build_team_features
          import props_model
          import daily_runner
          import forward_ledger
          import forward_reconciler
          import results_tracker
          print("Core NBA modules import successfully")
          PY
