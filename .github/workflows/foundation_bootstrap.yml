name: NBA Foundation Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/foundation-trigger'

jobs:
  build-player-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile build_player_features.py build_team_features.py props_model.py collect_stats.py

      - name: Backfill true 2025-26 historical season
        run: |
          # Sportsdataverse NBA release keys are ENDING years:
          # release 2026 == 2025-26 season.
          python collect_stats.py --start 2026 --end 2026 --master --out data/raw

      - name: Pull current 2026-27 completed games
        run: python collect_stats.py --current --out data/raw
        continue-on-error: true

      - name: Build leakage-safe player and team feature stores
        run: |
          python build_player_features.py --raw data/raw --out data/processed
          python build_team_features.py --raw data/raw --out data/processed

      - name: Verify recent-season coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/processed/player_features_status.json")
          if not p.exists():
              raise SystemExit("player_features_status.json missing")
          s = json.loads(p.read_text())
          print(json.dumps(s, indent=2))
          if s.get("status") != "READY":
              raise SystemExit("player feature store not ready")
          if 2025 not in s.get("seasons", []):
              raise SystemExit("2025-26 season is still missing; refusing stale foundation")
          PY

      - name: Train real player prop models
        run: python props_model.py --mode train

      - name: Verify props bundle
        run: |
          python - <<'PY'
          import pickle
          p = "models/props_models.pkl"
          b = pickle.load(open(p, "rb"))
          print({k:v for k,v in b.items() if k != "models"})
          print("trained markets:", sorted(b.get("models", {}).keys()))
          if b.get("status") != "trained" or len(b.get("models", {})) < 3:
              raise SystemExit("props model did not produce a valid trained bundle")
          PY

      - name: Commit foundation outputs
        run: |
          git config user.name "NBA Model Bot"
          git config user.email "actions@github.com"
          git add data/raw/hoopr_*_2026.csv data/raw/espn_current_*_2026.csv data/raw/hoopr_games_master.csv data/processed/player_*.csv data/processed/rotation_profiles_latest.csv data/processed/player_features_status.json data/processed/team_profiles_latest.csv data/processed/team_features_status.json models/props_models.pkl
          git diff --cached --quiet || git commit -m "🏀 Build NBA player and rotation foundation"
          git pull --rebase origin main
          git push
