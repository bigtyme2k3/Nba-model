name: NBA V1 Closing Market Capture

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  push:
    branches: [main]
    paths: ['.github/closing-trigger']
  workflow_dispatch:
    inputs:
      date:
        description: 'Eastern slate date; blank=today'
        required: false
        default: ''

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.window.outputs.ELIGIBLE }}
      target: ${{ steps.target.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Eastern slate date
        id: target
        env:
          MANUAL_DATE: ${{ inputs.date }}
        run: echo "date=$(python active_slate_date.py --date "$MANUAL_DATE")" >> "$GITHUB_OUTPUT"
      - name: Check every scheduled game before dependency installation
        id: window
        run: python capture_window.py --date ${{ steps.target.outputs.date }} --min 5 --max 30 >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.window.outputs.ELIGIBLE == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install capture dependencies
        if: steps.window.outputs.ELIGIBLE == 'true'
        run: pip install requests==2.31.0 pandas==2.1.0 numpy==1.26.0
      - name: Capture available exact-book markets immediately
        if: steps.window.outputs.ELIGIBLE == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scrape_odds.py --date ${{ steps.target.outputs.date }} --out data/raw
          python scrape_sportsbook_props.py --date ${{ steps.target.outputs.date }} --out data/raw --min-minutes-to-tip 1 --max-minutes-to-tip 30 --output-prefix sportsbook_props_closing
      - uses: actions/upload-artifact@v4
        if: steps.window.outputs.ELIGIBLE == 'true'
        with:
          name: closing-capture-${{ github.run_id }}
          retention-days: 7
          path: |
            data/raw/sportsbook_props_closing*.csv
            data/raw/sportsbook_props_closing_status.json
            data/tracking/closing_schedule/

  publish:
    needs: capture
    if: needs.capture.outputs.eligible == 'true'
    concurrency:
      group: nba-model-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CAPTURE_DATE: ${{ needs.capture.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reconciliation dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: closing-capture-${{ github.run_id }}
          path: capture_bundle
      - name: Reconcile captured quotes against the latest evidence
        run: |
          cp capture_bundle/raw/sportsbook_props_closing* data/raw/
          mkdir -p data/tracking/closing_schedule
          cp capture_bundle/tracking/closing_schedule/*.json data/tracking/closing_schedule/
          python closing_market.py --date "$CAPTURE_DATE" --input "data/raw/sportsbook_props_closing_${CAPTURE_DATE}.csv"
          python clv_reconciler.py
          python nba_v1_readiness.py
          TARGET=$(python active_slate_date.py) python build_dashboard.py
      - name: Publish captured evidence
        run: |
          git config user.name "NBA Model Bot"
          git config user.email "actions@github.com"
          for f in data/raw/sportsbook_props_closing* data/history/nba_prop_closing_snapshots.jsonl data/tracking/closing_market_status.json data/tracking/closing_schedule data/tracking/nba_prop_clv* data/tracking/nba_v1_readiness.json docs/index.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "NBA exact-book closing evidence — $CAPTURE_DATE"
          git push
