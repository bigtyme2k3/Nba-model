  <script>/* Linemate is a manual research workspace. No account data or site scraping. */
(function () {

  const text=(v,max=800)=>String(v??'').trim().slice(0,max);
  const kinds={ATS:'ATS record · each game’s spread',LINE:'Hit rate · one selected line',CONTEXT:'Injury, lineup or rotation'};
  const splits={SEASON:'Season',LAST5:'Last 5',LAST10:'Last 10',HOME:'Home',AWAY:'Away',H2H:'Head to head',B2B:'Back-to-back',WITH_WITHOUT:'With / without teammate',OTHER:'Other'};
  function matchupUrl(game,date) {
    const aliases={BKN:'BRO',OKC:'OKL'};
    const code=t=>aliases[t?.abbr]||t?.abbr;
    const away=code(game.away),home=code(game.home);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||![away,home].every(v=>/^[A-Z]{2,3}$/.test(v||'')))return 'https://linemate.io/nba';
    return `https://linemate.io/nba/summary/${date.replaceAll('-','')}-${away}-${home}`;
  }
  function normalize(input) {
    if(!kinds[input.kind])throw Error('Choose an observation type.');
    const row={kind:input.kind,subject:text(input.subject,100),split:input.split,basis:text(input.basis,160),note:text(input.note),verdict:input.verdict};
    if(!row.subject)throw Error('Enter the team or player.');
    if(!splits[row.split])throw Error('Choose a split.');
    if(!['SUPPORTS','CONFLICTS','UNCLEAR'].includes(row.verdict))throw Error('Choose how it compares with the model.');
    const count=(name,optional=false)=>{
      const value=input[name];
      if(optional&&(value===''||value==null))return 0;
      if(value===''||value==null||!Number.isInteger(Number(value))||Number(value)<0||Number(value)>5000)throw Error('Enter whole-number counts between 0 and 5,000.');
      return Number(value);
    };
    if(row.kind==='ATS') {
      row.wins=count('wins');row.losses=count('losses');row.pushes=count('pushes',true);
      if(!row.wins&&!row.losses&&!row.pushes)throw Error('Enter at least one graded ATS game.');
      if(!row.basis)throw Error('Identify the sportsbook and spread timing for this ATS record.');
    } else if(row.kind==='LINE') {
      if(input.line===''||input.line==null||!Number.isFinite(Number(input.line))||Math.abs(Number(input.line))>500)throw Error('Enter the exact selected line.');
      if(!['OVER','UNDER','COVER'].includes(input.side))throw Error('Choose Over, Under or Cover.');
      row.line=Number(input.line);row.side=input.side;row.hits=count('hits');row.sample=count('sample');
      if(!row.sample||row.hits>row.sample)throw Error('Hits must not exceed a positive sample size.');
      if(!row.basis)throw Error('Name the market or stat used for this hit rate.');
    } else if(!row.note)throw Error('Describe the injury, lineup or rotation observation.');
    return row;
  }
  function load(storage) {
    const rows=JSON.parse(storage.getItem(KEY)||'[]');
    if(!Array.isArray(rows))throw Error('Saved review notes could not be read. Your saved data has not been changed.');
    return rows.filter(r=>r&&typeof r==='object');
  }
  function append(storage,input,slate,game,source,now=new Date().toISOString()) {
    const row={...normalize(input),slate,game,source,reviewed_at:now};
    const rows=load(storage);rows.push(row);
    if(rows.length>500)throw Error('The review notebook has 500 entries. Download a backup and remove old entries before adding more.');
    storage.setItem(KEY,JSON.stringify(rows));return row;
  }
  const recordLabel=r=>r.kind==='ATS'?`ATS ${r.wins}–${r.losses}–${r.pushes}`:r.kind==='LINE'?`${r.side} ${r.line}: ${r.hits}/${r.sample} at this line`:'Availability / rotation';
  const opts=obj=>Object.entries(obj).map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
  const select=(name,label,items)=>`<label>${label}<select name="${name}">${opts(items)}</select></label>`;
  const number=(name,label)=>`<label>${label}<input type="number" name="${name}" min="0" max="5000" step="1" inputmode="numeric"></label>`;
  function list(rows) {
    return rows.length?rows.map((r,index)=>`<article class="linemate-entry"><div class="linemate-entry-top"><strong>${esc(r.subject)}</strong><span class="badge research">${esc(r.verdict==='SUPPORTS'?'Supports model':r.verdict==='CONFLICTS'?'Conflicts with model':'Unclear')}</span></div><p>${esc(recordLabel(r))} · ${esc(splits[r.split]||r.split)}</p>${r.basis?`<p class="small muted">Basis: ${esc(r.basis)}</p>`:''}${r.note?`<p class="linemate-note">${esc(r.note)}</p>`:''}<p class="snapshot-note">Manual observation · ${esc(new Date(r.reviewed_at).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))} ET</p><button type="button" class="small" data-review-remove="${index}">Remove this note</button></article>`).join(''):'<p class="small muted">No Linemate observations saved for this matchup and date.</p>';
  }
  function render(game,date,index) {
    const name=game.display_name||`${game.away.name} @ ${game.home.name}`;
    let rows=[],storageError=false;
    try {rows=load(window.localStorage).filter(r=>r.slate===date&&r.game===name);}catch(_){storageError=true;}
    return `<details class="linemate-review" data-review-game="${index}"><summary>Linemate review · ATS, splits &amp; injuries${rows.length?` (${rows.length})`:''}</summary><div class="details-content"><div class="linemate-links"><a class="button" href="${esc(matchupUrl(game,date))}" target="_blank" rel="noopener noreferrer">Open Linemate matchup ↗</a><a href="https://linemate.io/nba/trends" target="_blank" rel="noopener noreferrer">NBA trends ↗</a></div><p class="info-note"><strong>Manual research · no live data connection</strong><br>A hit rate at today’s selected spread is different from ATS against each game’s original spread. Record the exact line, split and sample. Historical hit rates are not model win probabilities.</p><p class="snapshot-note">Notes stay in this browser on this device. They do not sync to GitHub, change projections or qualify bets. Linemate+ views may require your own login.</p><div class="linemate-saved">${list(rows)}</div><form class="linemate-form" data-game-index="${index}"><h3>Add a research observation</h3><div class="linemate-fields">${select('kind','Observation type',kinds)}<label>Team or player<input name="subject" maxlength="100" placeholder="Team or player name" required></label>${select('split','Split / timeframe',splits)}${select('verdict','Comparison with model',{UNCLEAR:'Unclear / needs review',SUPPORTS:'Supports model direction',CONFLICTS:'Conflicts with model direction'})}</div><div class="linemate-counts" data-review-kind="ATS">${number('wins','ATS wins')}${number('losses','ATS losses')}${number('pushes','ATS pushes')}</div><div class="linemate-counts" data-review-kind="LINE" hidden><label>Exact line<input name="line" type="number" min="-500" max="500" step="any"></label>${select('side','Side',{COVER:'Cover',OVER:'Over',UNDER:'Under'})}${number('hits','Hits')}${number('sample','Games in sample')}</div><label>Market / source basis<input name="basis" maxlength="160" placeholder="ATS: sportsbook + line timing; hit rate: stat / market"></label><label>Observation<textarea name="note" maxlength="800" rows="3" placeholder="Availability, teammate absence, minutes, or why the source agrees or conflicts"></textarea></label><button class="button primary" type="submit">Save private observation</button><p class="linemate-feedback small" role="status">${storageError?'Browser storage is unavailable. Notes cannot be saved.':''}</p></form><button type="button" class="button linemate-backup" data-review-export>Download my review notes</button></div></details>`;
  }
  if(typeof module!=='undefined'&&module.exports){module.exports={normalize,load,append,matchupUrl,recordLabel};return;}
  function rowsFor(game,date){return load(window.localStorage).filter(r=>r.game===game&&r.slate===date);}
  document.addEventListener('change',event=>{
    if(!event.target.matches('.linemate-form select[name="kind"]'))return;
    for(const box of event.target.closest('form').querySelectorAll('[data-review-kind]')) {
      box.hidden=box.dataset.reviewKind!==event.target.value;
      for(const control of box.querySelectorAll('input,select'))control.disabled=box.hidden;
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('.linemate-form');if(!form)return;event.preventDefault();
    const feedback=form.querySelector('.linemate-feedback');
    try {
      const game=window.DATA.games[Number(form.dataset.gameIndex)],date=window.DATA.date;
      const name=game.display_name||`${game.away.name} @ ${game.home.name}`;
      append(window.localStorage,Object.fromEntries(new FormData(form)),date,name,matchupUrl(game,date));
      const panel=form.closest('.linemate-review');panel.querySelector('.linemate-saved').innerHTML=list(rowsFor(name,date));
      panel.querySelector('summary').textContent=`Linemate review · ATS, splits & injuries (${rowsFor(name,date).length})`;
      feedback.textContent='Saved in this browser. Model projections and BET status are unchanged.';form.querySelector('[name="note"]').value='';
    } catch(error){feedback.textContent=error.name==='QuotaExceededError'?'Browser storage is full. Download your notes before clearing space.':error.message;}
  });
  document.addEventListener('click',event=>{

  function modelStatus() {
    const evidence=D.readiness?.forward_evidence||{}, policy=D.readiness?.promotion_policy||{}, calibration=D.calibration?.markets?.prop_price||{};
    return `<details id="model-status" class="model-status"><summary>Model status &amp; validation</summary><p>Current model evidence is tracked separately from the historical forward-test record.</p>${progress('Current priced BETs',evidence.bet_rows,policy.min_forward_bets||200)}${progress('Current prop BETs',evidence.prop_bets,policy.min_prop_forward_bets||100)}${progress('Matched closing lines',evidence.clv_matched,policy.min_matched_closes||100)}<p>Calibration observations: ${fmt(calibration.graded||0,0)}. Validation uses earlier dates for fitting and later dates for testing.</p>${progress('Calibration training observations',calibration.training_rows,D.calibration?.min_graded||200)}${progress('Calibration holdout observations',calibration.holdout_rows,50)}<p>Data: ${esc(D.readiness?.data_model_healthy?'Ready':'Awaiting healthy inputs')} · Grading: ${esc((D.reconciliation?.status||'Unknown').toLowerCase())}</p></details>`;
  }

  function renderDiagnostics() {
    const report=D.yesterday_diagnostics||{}, sums=report.summary||{}, trailing=D.trailing_diagnostics||{};
    if(report.status!=='COMPLETE'&&report.status!=='PARTIAL_RESULTS')
      return '<section class="panel"><h2>Yesterday · model vs market</h2><p class="small muted">Waiting for dated, final box scores and pregame forecasts.</p></section>';
    const statRows=['PTS','REB','AST','THREES','PRA','MINUTES'].map(key=>{
      const r=report.stats?.[key]||{};
      return `<tr><td>${esc(key)}</td><td>${esc(fmt(r.sample,0))}</td><td>${esc(fmt(r.mae,2))}</td><td>${r.priced_directions?`${esc(fmt(r.directions_correct,0))}/${esc(fmt(r.priced_directions,0))}`:'—'}</td></tr>`;
    }).join('');
    const gameRows=(report.games||[]).map(g=>`<tr><td>${esc(g.game)}</td><td>${esc(fmt(g.model_margin))} / ${esc(fmt(g.actual_margin))}</td><td>${esc(fmt(g.model_total))} / ${esc(fmt(g.actual_total))}</td></tr>`).join('');
    const beatsMarket=numeric(sums.margin_mae_model)&&numeric(sums.margin_mae_market)
      ?Number(sums.margin_mae_model)<Number(sums.margin_mae_market):false;
    return `<section class="panel"><h2>Yesterday · model vs market ${badge('Research only','research')}</h2><p class="subtitle">${esc(dayLabel(report.date))} · ${esc(fmt(sums.completed_games,0))} final games of ${esc(fmt(sums.scheduled_games,0))}. No research lean is counted as a bet.</p><div class="detail-metrics" style="margin-top:16px">${metric('Winner calls',fmt(sums.winner_correct,0)+'/'+fmt(sums.winner_sample,0))}${metric('Spread MAE · model',fmt(sums.margin_mae_model,2))}${metric('Spread MAE · book',fmt(sums.margin_mae_market,2))}${metric('Total MAE · model',fmt(sums.total_mae_model,2))}${metric('Total MAE · book',fmt(sums.total_mae_market,2))}</div><p class="snapshot-note">${beatsMarket?'Model beat the posted spread benchmark this day.':'Book spread benchmark matched or beat the model this day.'} Shadow spread (35% model + 65% book): ${esc(fmt(sums.margin_mae_shadow,2))} MAE. Shadow forecasts are not approved betting lines.</p>${trailing.completed_games?`<p class="snapshot-note">Trailing ${esc(fmt(trailing.lookback_days,0))}-day window · ${esc(fmt(trailing.completed_games,0))} completed games: spread MAE model ${esc(fmt(trailing.margin_mae_model,2))}, market ${esc(fmt(trailing.margin_mae_market,2))}, shadow ${esc(fmt(trailing.margin_mae_shadow,2))}. Total MAE model ${esc(fmt(trailing.total_mae_model,2))}, market ${esc(fmt(trailing.total_mae_market,2))}.</p>`:''}<details class="details-link"><summary>Game-by-game actuals and prop accuracy</summary><div class="details-content"><table class="quote-table"><thead><tr><th>Game</th><th>Margin model / final</th><th>Total model / final</th></tr></thead><tbody>${gameRows}</tbody></table><p class="review-heading">Player stat forecast error</p><table class="quote-table"><thead><tr><th>Market</th><th>Players</th><th>MAE</th><th>Direction</th></tr></thead><tbody>${statRows}</tbody></table></div></details></section>`;
  }
  function renderResults() {
    const perf=D.forward_performance||{}, clv=D.clv_report||{}, rows=D.results||[];
    const record=numeric(perf.hit_rate)?`${perf.wins||0}–${perf.losses||0}`:'—';
    const stats=[['Record',record],['Hit rate',pct(perf.hit_rate)],['Flat 1u profit',signed(perf.profit_units,2)+'u'],['ROI',pct(perf.roi)]];
    const days=[...new Set(rows.map(r=>r.date))].sort().reverse();
    view.innerHTML=heading('Results','Historical forward test · priced BET decisions only.',badge('Recorded prices','research'))+`<div class="results-grid">${stats.map(([label,value])=>`<div class="result-stat">${metric(label,value)}</div>`).join('')}</div>${renderDiagnostics()}<div class="results-layout"><section class="panel"><h2 class="inline-title">Flat 1u test performance</h2>${chart(rows)}<p class="snapshot-note">Each graded bet risks 1u at its recorded sportsbook price. Consensus-priced game entries are excluded.</p></section><section class="panel"><h2 class="inline-title">Closing-line evidence</h2><p class="subtitle">Did the entry beat the same sportsbook’s closing quote?</p><div class="detail-metrics" style="margin-top:16px">${metric('Matched',fmt(clv.matched_closes||0,0))}${metric('Beat close',pct(clv.beat_close_rate))}${metric('Line CLV',fmt(clv.avg_line_clv,2))}</div><p class="small muted">Pending observations: ${fmt(perf.pending_rows||0,0)}<br>Excluded unpriced BET entries: ${fmt(perf.excluded_unpriced_bets||0,0)}</p></section></div><section class="panel">${modelStatus()}</section><div class="section-heading"><h2>Graded bet history</h2><span class="small muted">${rows.length} results</span></div><section class="filters"><div class="filter-grid"><label for="result-date">Date<select id="result-date">${options([['','All graded dates'],[D.yesterday,'Yesterday · '+dayLabel(D.yesterday)],...days.filter(d=>d!==D.yesterday).map(d=>[d,dayLabel(d)])],state.resultDate)}</select></label><label for="result-book">Sportsbook<select id="result-book">${options([['','All books'],...['fanduel','draftkings','fanatics','novig'].map(b=>[b,bookName(b)])],state.resultBook)}</select></label><label for="result-outcome">Outcome<select id="result-outcome">${options([['','All outcomes'],['WIN','Win'],['LOSS','Loss'],['PUSH','Push']],state.resultOutcome)}</select></label></div></section><section class="panel" id="result-history"></section>`;
    renderResultRows();
  }
  function renderResultRows() {
    const rows=(D.results||[]).filter(r=>(!state.resultDate||r.date===state.resultDate)&&(!state.resultBook||r.sportsbook_key===state.resultBook)&&(!state.resultOutcome||r.outcome===state.resultOutcome));
    document.getElementById('result-history').innerHTML=rows.map(r=>`<article class="result-row"><div><strong>${esc(r.player?`${r.player} · ${r.stat} ${r.side} ${fmt(r.line)}`:`${r.game} · ${r.market} ${r.side} ${fmt(r.line)}`)}</strong><p class="subtitle">${esc(dayLabel(r.date))} · ${esc(bookName(r.sportsbook_key))} ${esc(odds(r.odds))} · Actual ${esc(fmt(r.actual))}</p></div><div><span class="badge ${r.outcome==='WIN'?'bet':''}">${esc(r.outcome)}</span><div class="small ${r.outcome.toLowerCase()}">${esc(signed(r.profit_units,2))}u</div></div></article>`).join('')||empty('No priced BET results for this filter','Research observations and excluded consensus entries do not count as graded bets.');
  }
  function renderTab(tab,focus=false) {
    state.tab=tab;
    for(const button of document.querySelectorAll('[data-tab]')){const selected=button.dataset.tab===tab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;}
    view.setAttribute('aria-labelledby','tab-'+tab);
    ({today:renderToday,games:renderGames,props:renderProps,results:renderResults}[tab]||renderToday)();
    window.scrollTo({top:0,behavior:'instant'});
    if(focus)view.focus({preventScroll:true});
  }
  document.addEventListener('click',event=>{
    const control=event.target.closest('[data-tab],[data-action]');if(!control)return;
    if(control.dataset.tab){renderTab(control.dataset.tab);return;}
    switch(control.dataset.action){
      case 'view-props':renderTab('props',true);break;
      case 'view-games':state.game='';renderTab('games',true);break;
      case 'linemate-review':state.game='';renderTab('games',true);document.querySelector('.more-menu').open=false;const review=document.querySelector('.linemate-review');if(review){review.open=true;review.scrollIntoView({block:'start'});}break;
      case 'game-props':state.filters.game=games[Number(control.dataset.gameIndex)]?.display_name||'';state.filters.search='';state.limit=25;renderTab('props',true);break;
      case 'player-props':state.filters={search:control.dataset.player||'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderTab('props',true);break;
      case 'reset-filters':state.filters={search:'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderProps();document.getElementById('player-search').focus();break;
      case 'more-props':state.limit+=25;renderPropRows();break;
      case 'model-status':renderTab('results',true);document.querySelector('.more-menu').open=false;document.getElementById('model-status').open=true;document.getElementById('model-status').scrollIntoView({block:'center'});break;
    }
  });
  document.addEventListener('input',event=>{if(event.target.id==='player-search'){state.filters.search=event.target.value;state.limit=25;renderPropRows();}});
  document.addEventListener('change',event=>{
    const id=event.target.id;
    if(id.startsWith('filter-')){state.filters[id.slice(7)]=event.target.value;state.limit=25;if(id==='filter-stat'){if(!state.filters.stat&&state.filters.sort==='gap')state.filters.sort='player';renderProps();}else renderPropRows();}
    if(id==='game-select'){state.game=event.target.value;renderGames();}
    if(id==='result-date'){state.resultDate=event.target.value;renderResultRows();}
    if(id==='result-book'){state.resultBook=event.target.value;renderResultRows();}
    if(id==='result-outcome'){state.resultOutcome=event.target.value;renderResultRows();}
  });
  document.querySelector('.tabs').addEventListener('keydown',event=>{
    const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;
    const tabs=[...document.querySelectorAll('[data-tab]')], index=tabs.indexOf(document.activeElement);if(index<0)return;
    event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    renderTab(tabs[next].dataset.tab);tabs[next].focus();
  });
  freshness();renderTab('today');
}());
</script>
</body>
</html>
