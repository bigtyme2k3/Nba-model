(function () {

  const kinds={ATS:'ATS record · each game’s spread',LINE:'Hit rate · one selected line',CONTEXT:'Injury, lineup or rotation'};
  const splits={SEASON:'Season',LAST5:'Last 5',LAST10:'Last 10',HOME:'Home',AWAY:'Away',H2H:'Head to head',B2B:'Back-to-back',WITH_WITHOUT:'With / without teammate',OTHER:'Other'};
  function matchupUrl(game,date) {
    const aliases={BKN:'BRO',OKC:'OKL'};
    const code=t=>aliases[t?.abbr]||t?.abbr;
    const away=code(game.away),home=code(game.home);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||![away,home].every(v=>/^[A-Z]{2,3}$/.test(v||'')))return 'https://linemate.io/nba';
    return `https://linemate.io/nba/summary/${date.replaceAll('-','')}-${away}-${home}`;
  }
  function normalize(input) {
    if(!kinds[input.kind])throw Error('Choose an observation type.');
    const row={kind:input.kind,subject:text(input.subject,100),split:input.split,basis:text(input.basis,160),note:text(input.note),verdict:input.verdict};
    if(!row.subject)throw Error('Enter the team or player.');
    if(!splits[row.split])throw Error('Choose a split.');
    if(!['SUPPORTS','CONFLICTS','UNCLEAR'].includes(row.verdict))throw Error('Choose how it compares with the model.');
    const count=(name,optional=false)=>{
      const value=input[name];
      if(optional&&(value===''||value==null))return 0;
      if(value===''||value==null||!Number.isInteger(Number(value))||Number(value)<0||Number(value)>5000)throw Error('Enter whole-number counts between 0 and 5,000.');
      return Number(value);
    };
    if(row.kind==='ATS') {
      row.wins=count('wins');row.losses=count('losses');row.pushes=count('pushes',true);
      if(!row.wins&&!row.losses&&!row.pushes)throw Error('Enter at least one graded ATS game.');
      if(!row.basis)throw Error('Identify the sportsbook and spread timing for this ATS record.');
    } else if(row.kind==='LINE') {
      if(input.line===''||input.line==null||!Number.isFinite(Number(input.line))||Math.abs(Number(input.line))>500)throw Error('Enter the exact selected line.');
      if(!['OVER','UNDER','COVER'].includes(input.side))throw Error('Choose Over, Under or Cover.');
      row.line=Number(input.line);row.side=input.side;row.hits=count('hits');row.sample=count('sample');
      if(!row.sample||row.hits>row.sample)throw Error('Hits must not exceed a positive sample size.');
      if(!row.basis)throw Error('Name the market or stat used for this hit rate.');

    if(rows.length>500)throw Error('The review notebook has 500 entries. Download a backup and remove old entries before adding more.');
    storage.setItem(KEY,JSON.stringify(rows));return row;
  }
  const recordLabel=r=>r.kind==='ATS'?`ATS ${r.wins}–${r.losses}–${r.pushes}`:r.kind==='LINE'?`${r.side} ${r.line}: ${r.hits}/${r.sample} at this line`:'Availability / rotation';
  const opts=obj=>Object.entries(obj).map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
  const select=(name,label,items)=>`<label>${label}<select name="${name}">${opts(items)}</select></label>`;
  const number=(name,label)=>`<label>${label}<input type="number" name="${name}" min="0" max="5000" step="1" inputmode="numeric"></label>`;
  function list(rows) {
    return rows.length?rows.map((r,index)=>`<article class="linemate-entry"><div class="linemate-entry-top"><strong>${esc(r.subject)}</strong><span class="badge research">${esc(r.verdict==='SUPPORTS'?'Supports model':r.verdict==='CONFLICTS'?'Conflicts with model':'Unclear')}</span></div><p>${esc(recordLabel(r))} · ${esc(splits[r.split]||r.split)}</p>${r.basis?`<p class="small muted">Basis: ${esc(r.basis)}</p>`:''}${r.note?`<p class="linemate-note">${esc(r.note)}</p>`:''}<p class="snapshot-note">Manual observation · ${esc(new Date(r.reviewed_at).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))} ET</p><button type="button" class="small" data-review-remove="${index}">Remove this note</button></article>`).join(''):'<p class="small muted">No Linemate observations saved for this matchup and date.</p>';
  }
  function render(game,date,index) {

 market"></label><label>Observation<textarea name="note" maxlength="800" rows="3" placeholder="Availability, teammate absence, minutes, or why the source agrees or conflicts"></textarea></label><button class="button primary" type="submit">Save private observation</button><p class="linemate-feedback small" role="status">${storageError?'Browser storage is unavailable. Notes cannot be saved.':''}</p></form><button type="button" class="button linemate-backup" data-review-export>Download my review notes</button></div></details>`;
  }
  if(typeof module!=='undefined'&&module.exports){module.exports={normalize,load,append,matchupUrl,recordLabel};return;}
  function rowsFor(game,date){return load(window.localStorage).filter(r=>r.game===game&&r.slate===date);}
  document.addEventListener('change',event=>{
    if(!event.target.matches('.linemate-form select[name="kind"]'))return;
    for(const box of event.target.closest('form').querySelectorAll('[data-review-kind]')) {
      box.hidden=box.dataset.reviewKind!==event.target.value;
      for(const control of box.querySelectorAll('input,select'))control.disabled=box.hidden;
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('.linemate-form');if(!form)return;event.preventDefault();
    const feedback=form.querySelector('.linemate-feedback');
    try {
      const game=window.DATA.games[Number(form.dataset.gameIndex)],date=window.DATA.date;
      const name=game.display_name||`${game.away.name} @ ${game.home.name}`;
      append(window.localStorage,Object.fromEntries(new FormData(form)),date,name,matchupUrl(game,date));
      const panel=form.closest('.linemate-review');panel.querySelector('.linemate-saved').innerHTML=list(rowsFor(name,date));
      panel.querySelector('summary').textContent=`Linemate review · ATS, splits & injuries (${rowsFor(name,date).length})`;
      feedback.textContent='Saved in this browser. Model projections and BET status are unchanged.';form.querySelector('[name="note"]').value='';
    } catch(error){feedback.textContent=error.name==='QuotaExceededError'?'Browser storage is full. Download your notes before clearing space.':error.message;}
  });
  document.addEventListener('click',event=>{
    const remove=event.target.closest('[data-review-remove]');
    if(remove) {
      const panel=remove.closest('.linemate-review'),game=window.DATA.games[Number(panel.dataset.reviewGame)],date=window.DATA.date,name=game.display_name||`${game.away.name} @ ${game.home.name}`;
      try {
        const rows=load(window.localStorage),matching=rows.map((r,i)=>({r,i})).filter(x=>x.r.game===name&&x.r.slate===date),target=matching[Number(remove.dataset.reviewRemove)];

      } catch(_){panel.querySelector('.linemate-feedback').textContent='Could not remove the note. Browser storage is unavailable.';}
    }

      try {

      } catch(_){event.target.closest('.linemate-review').querySelector('.linemate-feedback').textContent='Could not download the review notes.';}
    }
  });
  window.LinemateReview={render,matchupUrl};
}());

(function () {

  const LABELS = {AGREES_WITH_MARKET:['Agrees with market',''], MC_FAVORS_SIDE:['MC favors recorded side','research'],

      const hit = !num(line) || push ? null : (side === 'UNDER' ? x[cat] < line : x[cat] > line);
      const cls = push ? 'cs-bar push' : hit === null ? 'cs-bar' : hit ? 'cs-bar hit' : 'cs-bar miss';
      const label = `${x.date} ${x.home?'vs':'@'} ${x.opp}: ${x[cat]} ${cat}, ${fmt(x.minutes,0)} min${x.b2b?', back-to-back':''}${x.low_minutes?', low minutes':''}`;
      return `<g><title>${esc(label)}</title><rect class="${cls}" x="${pad + i*bw + 2}" y="${y(x[cat])}" width="${Math.max(bw-4,2)}" height="${Math.max(h,1)}" rx="2"></rect>`
        + `<text class="cs-val" x="${pad + i*bw + bw/2}" y="${y(x[cat]) - 3}" text-anchor="middle">${esc(fmt(x[cat],0))}</text>`
        + `<text class="cs-axis" x="${pad + i*bw + bw/2}" y="${H-20}" text-anchor="middle">${esc((x.home?'':'@')+(x.opp||''))}</text>`
        + `<text class="cs-axis ${x.low_minutes?'warn':''}" x="${pad + i*bw + bw/2}" y="${H-8}" text-anchor="middle">${esc(fmt(x.minutes,0))}${x.b2b?'·B':''}</text></g>`;
    }).join('');
    const ref = num(line) ? `<line class="cs-line" x1="${pad}" x2="${W}" y1="${y(line)}" y2="${y(line)}"></line><text class="cs-axis" x="2" y="${y(line)+3}">${esc(fmt(line))}</text>` : '';
    return `<svg class="cs-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Last ${g.length} games, ${cat}`)}">${bars}${ref}</svg>`;
  }

  function hitText(h, side) {
    if (!h) return '—';
    const k = String(side||'OVER').toLowerCase();
    return `${h[k]}/${h.n - h.push}${h.push ? ` (${h.push}P)` : ''}`;
  }

  const api = {heatClass, filterPlayers, sortPlayers, filterTonight, chartSvg, hitText};
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; return; }

  const state = {f:{search:'',team:'',category:'',book:'',date:''}, sort:'rank', dir:1, mode:'A', player:null, chartCat:null, showReserve:false};
  const badge = (t, k='') => `<span class="badge ${k}">${esc(t)}</span>`;
  const statusBadge = s => badge(s||'PASS', s==='BET'?'bet':s==='LEAN'?'research':s==='WATCH'?'warning':'');
  let view, C, R;

  function kpis() {
    const k = C.kpis || {}, r7 = k.results_7d || {}, t = r7.trends || {}, l = r7.exact_lines || {};
    const results = t.n ? `${t.hits}-${t.misses}` : '—';
    const tiles = [[k.active_players ?? 0,'Active players',`of 20 · ${k.reserve_players ?? 0} reserve`],
      [k.qualified_trends ?? 0,'Qualified trends','80%+ at a meaningful threshold'],
      [k.active_streaks ?? 0,'Active streaks','5+ games in a row'],
      [k.tonight_players ?? 0,'Playing tonight','active list'],
      [k.potential_edges ?? 0,'Potential edges',`${k.bets ?? 0} BET · rest LEAN`],
      [results,'Results · 7 days',l.n ? `lines ${l.hits}-${l.misses}` : 'trends hit-miss']];
    const fr = C.freshness || {};
    const missing = (fr.missing_feeds||[]);
    return `<section class="cs-kpis">${tiles.map(([v,label,sub]) => `<div class="summary-item"><div class="summary-value">${esc(v)}</div><div class="summary-label">${esc(label)}</div><div class="cs-sub">${esc(sub)}</div></div>`).join('')}</section>
      <p class="small muted cs-fresh">Refreshed ${esc(timeET(C.generated_at_utc))} (${esc(C.phase||'')}) · box scores through ${esc(dayET(fr.last_box_score_date))}${fr.stale_box_scores?' <b class="loss">· stale</b>':''} · props ${esc(timeET(fr.props_scraped_at))} · injuries ${fr.injury_feed?.healthy?'ok':'<b class="loss">unavailable</b>'}${missing.length?` · <span class="cs-missing">Missing: ${missing.map(esc).join('; ')}</span>`:''}</p>`;
  }

  function filters() {
    const all = [...(C.active||[]), ...(C.reserve||[])];
    const teams = [...new Set(all.map(p => p.team))].sort();
    const dates = [...new Set((R?.history||[]).map(h => h.date))].sort().reverse();
    const opt = (items, sel) => items.map(([v,l]) => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
    return `<section class="filters cs-filters"><input id="cs-search" class="search-input" type="search" placeholder="Search players" value="${esc(state.f.search)}" aria-label="Search players">
      <select id="cs-team" aria-label="Team">${opt([['','All teams'],...teams.map(t=>[t,t])], state.f.team)}</select>
      <select id="cs-category" aria-label="Category">${opt([['','All categories'],...CATS.map(c=>[c,c])], state.f.category)}</select>
      <select id="cs-book" aria-label="Sportsbook">${opt([['','All books'],...BOOKS.map(([k,s])=>[k,{fanduel:'FanDuel',draftkings:'DraftKings',fanatics:'Fanatics'}[k]])], state.f.book)}</select>
      <select id="cs-date" aria-label="Results date">${opt([['','All result dates'],...dates.map(d=>[d,dayET(d)])], state.f.date)}</select></section>`;
  }

  function leaderboard() {
    const pool = state.showReserve ? [...(C.active||[]), ...(C.reserve||[])] : (C.active||[]);
    const rows = sortPlayers(filterPlayers(pool, state.f), state.sort, state.dir);
    const th = (key, label) => key ? `<th><button type="button" class="cs-sort" data-cs-sort="${key}" aria-label="Sort by ${esc(label)}">${esc(label)}${state.sort===key?(state.dir>0?' ▲':' ▼'):''}</button></th>` : `<th>${esc(label)}</th>`;
    const head = `<tr>${th('rank','#')}${th('player','Player')}${th('gp','GP / MPG')}${th('next','Next')}${th('','Best')}${th('','Threshold')}${th('season','Season')}${th('l10','L10')}${th('l5','L5')}${th('streak','Streak')}${th('score','Score')}${th('','Model P')}${th('','Best odds')}${th('edge','Edge')}${th('status','Status')}</tr>`;
    const body = rows.map(p => {
      const c = p.categories?.[p.best_category] || {}, bl = p.best_line || {};
      const flags = [p.override ? badge('Manual','warning') : '', p.injury_flag ? badge(p.injury,'warning') : '', p.minutes_restriction ? badge('Min. limit','warning') : ''].join('');
      const next = p.next_game ? (p.next_game.tip ? `${p.next_game.home?'vs':'@'} ${p.next_game.opp} ${timeET(p.next_game.tip)}` : dayET(p.next_game.date)) : '—';
      return `<tr class="${state.player===p.player_id?'cs-selected':''}"><td>${esc(p.rank)}</td><td class="cs-name"><button type="button" class="cs-link" data-cs-player="${p.player_id}">${esc(p.player)}</button><span class="small muted">${esc(p.team)}</span>${flags}</td>
        <td>${p.gp} / ${fmt(p.mpg)}</td><td class="small">${esc(next)}</td><td>${esc(p.best_category)}</td><td>${esc(c.threshold)}+</td>
        <td>${pct(c.season_rate)}</td><td>${pct(c.l10_rate)}</td><td>${pct(c.l5_rate)}</td><td>${c.streak??'—'}</td><td><b>${fmt(p.score)}</b></td>
        <td>${num(bl.calibrated_probability)?pct(bl.calibrated_probability,1):'<span class="muted" title="Not calibrated">—</span>'}</td>
        <td class="small">${bl.best_odds!=null?`${esc(bl.category)} ${esc(bl.side?.[0])}${esc(bl.line)} ${esc(odds(bl.best_odds))}`:'—'}</td>
        <td>${num(bl.edge)?signedPct(bl.edge):'—'}</td><td>${statusBadge(p.status)}${p.status_reason?`<span class="small muted cs-reason">${esc(p.status_reason)}</span>`:''}</td></tr>`;
    }).join('');
    const empty = (C.active||[]).length < 20 ? `<p class="small muted">${(C.active||[]).length} players qualify today; empty slots stay empty.</p>` : '';
    return `<section class="panel cs-section"><div class="cs-head"><h2 class="inline-title">Leaderboard</h2><label class="small"><input id="cs-reserve" type="checkbox" ${state.showReserve?'checked':''}> Show reserve (${(C.reserve||[]).length})</label></div>
      <p class="subtitle">Ranked by consistency score. Best category = the player's highest-scoring qualifying category. Model P and edge appear only when the prop calibration is validated (${esc(C.calibration?.status||'unknown')} now).</p>
      <div class="table-wrap"><table class="cs-table">${head}<tbody>${body || '<tr><td colspan="15" class="muted">No qualified players match these filters.</td></tr>'}</tbody></table></div>${empty}</section>`;
  }

  function matrixA(players) {
    const cats = state.f.category ? [state.f.category] : CATS;
    const body = players.map(p => `<tr><td class="cs-name"><button type="button" class="cs-link" data-cs-player="${p.player_id}">${esc(p.player)}</button></td>${cats.map(cat => {
      const c = p.categories?.[cat];
      if (!c) return '<td class="heat-warn">—</td>';
      const streak = c.streak >= 5 ? `<span class="cs-streak" title="${c.streak}-game streak">●${c.streak}</span>` : '';
      return `<td class="${heatClass(c,p)}" title="${esc(`${cat} ${c.threshold}+: ${c.season_hits}/${c.gp} season, ${c.l10_hits}/${c.l10_n} last 10`)}"><b>${esc(c.threshold)}+</b>${streak}<span>${pct(c.season_rate)} · L10 ${pct(c.l10_rate)}</span></td>`;
    }).join('')}</tr>`).join('');
    return `<div class="table-wrap"><table class="cs-heat"><tr><th>Player</th>${cats.map(c=>`<th>${c}</th>`).join('')}</tr>${body}</table></div>
      <p class="small muted cs-legend"><span class="heat-90">90%+</span><span class="heat-80">80–89%</span><span class="heat-70">70–79%</span><span class="heat-low">under 70%</span><span class="heat-warn">under 10 games or injury</span> ● active streak of 5+</p>`;
  }

  function matrixB() {
    const rows = filterTonight(C.tonight, state.f);
    if (!rows.length) return '<p class="small muted">No exact sportsbook lines for these filters. Lines are collected for PTS, REB, AST, 3PM and PRA; STL, BLK, PA, PR and RA have none.</p>';
    const body = rows.map(r => {
      const k = String(r.side).toLowerCase();
      const books = BOOKS.map(([b]) => { const q = r.books?.[b] || {}; return `<td>${q[k]!=null?odds(q[k]):q.line!=null&&q.line!==r.line?`<span class="muted" title="Different line">${esc(q.line)}</span>`:'—'}</td>`; }).join('');
      return `<tr><td class="cs-name">${esc(r.player)}<span class="small muted">${esc(r.team)} ${r.home?'vs':'@'} ${esc(r.opp)}</span></td><td>${esc(r.category)} ${esc(r.side)} ${esc(r.line)}</td>
        <td>${esc(hitText(r.hits?.l5,r.side))}</td><td>${esc(hitText(r.hits?.l10,r.side))}</td><td>${esc(hitText(r.hits?.season,r.side))}</td>${books}
        <td>${esc(odds(r.best_odds))} <span class="small muted">${esc((BOOKS.find(([b])=>b===r.best_book)||[])[1]||'')}</span></td><td>${pct(r.break_even,1)}</td>
        <td>${fmt(r.projection)}</td><td>${num(r.calibrated_probability)?pct(r.calibrated_probability,1):`<span class="muted" title="Raw model, not calibrated">${num(r.model_probability)?pct(r.model_probability,1)+'*':'—'}</span>`}</td>
        <td>${num(r.edge)?signedPct(r.edge):'—'}</td></tr>`;
    }).join('');
    return `<div class="table-wrap"><table class="cs-table"><tr><th>Player</th><th>Line</th><th>L5</th><th>L10</th><th>Season</th><th>FD</th><th>DK</th><th>FAN</th><th>Best</th><th>Break-even</th><th>Proj.</th><th>Prob.</th><th>Edge</th></tr>${body}</table></div>
      <p class="small muted">Hit counts are at the exact line (pushes excluded and shown as P). Prices are for the side shown; a grey number means that book is on a different line. * raw model probability, not calibrated, so no edge is shown.</p>`;
  }

  function analysis() {
    const players = filterPlayers([...(C.active||[]), ...(state.showReserve ? C.reserve||[] : [])], state.f);
    return `<section class="panel cs-section"><div class="cs-head"><h2 class="inline-title">Statistical analysis</h2><div class="lab-nav">
      <button type="button" class="lab-nav-btn" data-cs-mode="A" aria-pressed="${state.mode==='A'}">A · Consistency matrix</button>
      <button type="button" class="lab-nav-btn" data-cs-mode="B" aria-pressed="${state.mode==='B'}">B · Exact lines tonight</button></div></div>
      ${state.mode==='A' ? matrixA(players) : matrixB()}</section>`;
  }

  function deepDive() {
    const all = [...(C.active||[]), ...(C.reserve||[])];
    const p = all.find(x => x.player_id === state.player) || all[0];
    if (!p) return '';
    const cat = state.chartCat || p.best_category;
    const line = (C.tonight||[]).find(r => r.player_id === p.player_id && r.category === cat);
    const c = p.categories?.[cat] || {};
    const cards = CATS.map(k => { const x = p.categories?.[k] || {}; const tl = (C.tonight||[]).find(r => r.player_id===p.player_id && r.category===k);
      return `<button type="button" class="cs-card ${k===cat?'active':''} ${heatClass(x,p)}" data-cs-chart="${k}"><div class="cs-card-top"><b>${k}</b>${(p.qualifying_categories||[]).includes(k)?badge('Qualified','bet'):''}</div>
        <div class="cs-card-grid"><span>Avg ${fmt(x.mean)}</span><span>SD ${fmt(x.std)}</span><span>Med ${fmt(x.median)}</span><span>L5 ${fmt(x.l5_avg)}</span><span>L10 ${fmt(x.l10_avg)}</span><span>Streak ${x.streak??'—'}</span></div>
        <div class="small">${esc(x.threshold)}+ · ${x.season_hits}/${x.gp} · L10 ${x.l10_hits}/${x.l10_n}</div><div class="small muted">${tl?`Line ${esc(tl.side)} ${esc(tl.line)} · ${esc(odds(tl.best_odds))}`:'No sportsbook line'}</div></button>`; }).join('');
    const sp = p.splits?.[cat] || {};
    const splitRows = Object.entries(sp).map(([label,[n,avg,rate]]) => `<tr><td>${esc(label)}</td><td>${n}</td><td>${fmt(avg)}</td><td>${pct(rate)}</td></tr>`).join('');
    const cs = Object.entries(p.combined_stability||{}).map(([k,v]) => `<tr><td>${k}</td><td>${fmt(v.mean)}</td><td>${fmt(v.std)}</td><td>${fmt(v.cv,2)}</td><td>${fmt(v.offset_ratio,2)}</td></tr>`).join('');
    const ng = p.next_game;
    return `<section class="panel cs-section" id="cs-deep"><div class="cs-head"><h2 class="inline-title">Player deep dive · ${esc(p.player)}</h2>${statusBadge(p.status)}</div>
      <p class="subtitle">#${esc(p.rank)} · ${esc(p.team_name)} ${esc(p.position||'')} · ${p.gp} GP (${p.dnp} DNP excluded, ${p.low_minute_games} under 15 min) · ${fmt(p.mpg)} MPG (CV ${fmt(p.minutes_cv,2)}) · score ${fmt(p.score)} · last game ${esc(dayET(p.last_game))}
      ${ng?` · next ${ng.tip?`${ng.home?'vs':'@'} ${esc(ng.opp)} ${esc(timeET(ng.tip))}`:esc(dayET(ng.date))}`:''}${num(p.projected_minutes)?` · projected ${fmt(p.projected_minutes)} min`:''}${p.injury?` · <b class="loss">${esc(p.injury)}</b>`:''}${p.override?` · <b>Manual override: ${esc(p.override_reason||'')}</b>`:''}</p>
      ${(p.preferences_missed||[]).length?`<p class="small muted">Preferences missed: ${p.preferences_missed.map(esc).join(', ')}</p>`:''}
      <div class="cs-cards">${cards}</div>
      <h3 class="review-heading">Last ${(p.last20||[]).length} games · ${cat} vs ${line?`tonight's line (${line.side} ${line.line})`:`${c.threshold}+ threshold`} (opponent, minutes; ·B = back-to-back)</h3>
      <div class="table-wrap"><div class="cs-chart-wrap">${chartSvg(p.last20, cat, line ? line.line : (num(c.threshold) ? c.threshold - .5 : null), line ? line.side : 'OVER')}</div></div>
      <div class="cs-two"><div><h3 class="review-heading">${cat} splits at ${esc(c.threshold)}+ (games, average, hit rate)</h3><div class="table-wrap"><table class="cs-table"><tr><th>Split</th><th>GP</th><th>Avg</th><th>Hit</th></tr>${splitRows}</table></div></div>
      <div><h3 class="review-heading">Combined-stat stability (from per-game totals)</h3><div class="table-wrap"><table class="cs-table"><tr><th>Stat</th><th>Avg</th><th>SD</th><th>CV</th><th>SD ÷ parts</th></tr>${cs}</table></div>
      <p class="small muted">SD ÷ parts below 1 means the components offset each other, so the combined line is steadier than its pieces.</p></div></div></section>`;
  }

  function tonight() {
    const rows = filterTonight(C.tonight, state.f).sort((a,b) => (STATUS_ORDER[a.recommendation]-STATUS_ORDER[b.recommendation]) || String(a.tip).localeCompare(String(b.tip)));
    const row = r => `<tr><td class="cs-name">${esc(r.player)}<span class="small muted">${r.home?'vs':'@'} ${esc(r.opp)} · ${esc(timeET(r.tip))}</span></td><td>${esc(r.category)} ${esc(r.side)} ${esc(r.line)}</td>
      <td>${esc(hitText(r.hits?.l5,r.side))} · ${esc(hitText(r.hits?.l10,r.side))} · ${esc(hitText(r.hits?.season,r.side))}</td><td>${fmt(r.projection)}</td><td>${fmt(r.projected_minutes)}</td>
      <td class="small">${esc(r.injury || (r.injury_adjustment && r.injury_adjustment!=='NONE' ? r.injury_adjustment.replaceAll('_',' ').toLowerCase() : '—'))}${num(r.opportunity_minutes_delta)&&r.opportunity_minutes_delta?` (${r.opportunity_minutes_delta>0?'+':''}${fmt(r.opportunity_minutes_delta)} min)`:''}</td>
      <td>${esc((BOOKS.find(([b])=>b===r.best_book)||[])[1]||'—')} ${esc(odds(r.best_odds))}</td><td>${pct(r.break_even,1)}</td><td>${num(r.edge)?signedPct(r.edge):'—'}</td>
      <td>${statusBadge(r.recommendation)}${(r.failed_checks||[]).length?`<span class="small muted cs-reason">${esc(r.failed_checks.map(x=>x.replaceAll('_',' ')).join(', '))}</span>`:''}</td></tr>`;
    const live = rows.filter(r => r.recommendation !== 'PASS'), passed = rows.filter(r => r.recommendation === 'PASS');
    const head = '<tr><th>Player</th><th>Line</th><th>L5 · L10 · Season</th><th>Proj.</th><th>Proj. min</th><th>Injury adj.</th><th>Best</th><th>Break-even</th><th>Edge</th><th>Call</th></tr>';
    const body = live.map(row).join('');
    const passTable = passed.length ? `<details class="details-link"><summary>PASS (${passed.length}) · failed a check</summary><div class="table-wrap"><table class="cs-table">${head}${passed.map(row).join('')}</table></div></details>` : '';
    return `<section class="panel cs-section"><h2 class="inline-title">Tonight's opportunities</h2>
      <p class="subtitle">BET needs a calibrated probability that beats break-even by 3 points with every check passing. LEAN: every check passes and the exact-line record is 70%+ (season and last 10) and beats break-even, but it isn't validated. WATCH: needs more information. PASS: fails a check.</p>
      <div class="table-wrap"><table class="cs-table">${head}${body||'<tr><td colspan="10" class="muted">No BET, LEAN or WATCH lines for these filters.</td></tr>'}</table></div>${passTable}</section>`;
  }

  function results() {
    if (!R || !R.graded) return `<section class="panel cs-section"><h2 class="inline-title">Results</h2><p class="small muted">Nothing graded yet. Every monitored trend and exact line is graded after the games.</p></section>`;
    const line = (label, s, units=false) => `<tr><td>${esc(label)}</td><td>${s?.n?`${s.hits}-${s.misses}${s.pushes?`-${s.pushes}`:''}`:'—'}</td><td>${pct(s?.hit_rate,1)}</td><td>${s?.void_dnp||0}</td><td>${units&&num(s?.units_if_followed)?`${s.units_if_followed>0?'+':''}${fmt(s.units_if_followed,2)}u`:'—'}</td></tr>`;
    const hist = (R.history||[]).filter(h => (!state.f.date || h.date === state.f.date) && (!state.f.category || h.category === state.f.category)
      && (!state.f.team || h.team === state.f.team) && (!state.f.search || String(h.player).toLowerCase().includes(state.f.search.toLowerCase()))).slice(0, 80);
    const rows = hist.map(h => `<tr><td>${esc(dayET(h.date))}</td><td>${esc(h.player)}</td><td>${esc(h.kind==='TREND'?`${h.category} ${h.threshold}+`:`${h.category} ${h.side} ${h.line}`)}</td><td>${esc(h.kind==='TREND'?'Trend':h.recommendation)}</td><td>${fmt(h.actual)}</td><td class="${['HIT','WIN'].includes(h.outcome)?'win':['MISS','LOSS'].includes(h.outcome)?'loss':'push'}">${esc(h.outcome)}</td></tr>`).join('');
    return `<section class="panel cs-section"><h2 class="inline-title">Results</h2><p class="subtitle">${esc(R.note||'')}</p>
      <div class="table-wrap"><table class="cs-table"><tr><th>Group</th><th>Record</th><th>Hit rate</th><th>DNP void</th><th>If followed</th></tr>
      ${line('Individual trends (PTS AST REB 3PM STL BLK)', R.individual_trends)}${line('Combined trends (PRA PA PR RA)', R.combined_trends)}
      ${line('Alternate thresholds (all trends)', R.alternate_thresholds)}${line('Exact sportsbook lines', R.exact_lines, true)}
      ${line('LEAN lines', R.by_recommendation?.LEAN, true)}${line('BET-qualified', R.bet_qualified, true)}${line('Last 7 days · trends', R.rolling_7d?.trends)}${line('Last 7 days · lines', R.rolling_7d?.exact_lines, true)}</table></div>
      <details class="details-link"><summary>Graded selections (${hist.length})</summary><div class="table-wrap"><table class="cs-table"><tr><th>Date</th><th>Player</th><th>Selection</th><th>Type</th><th>Actual</th><th>Result</th></tr>${rows}</table></div></details></section>`;
  }

  function render() {
    if (!C || !(C.active||[]).length && !(C.reserve||[]).length) {
      view.innerHTML = `<div class="page-heading"><div><h1>Player consistency</h1><p class="subtitle">The 20 most consistent players and their trends.</p></div></div><div class="empty-state"><h2>No consistency snapshot for this slate</h2><p>It builds with the daily run and again before tip.</p></div>${results()}`;
      return;
    }
    view.innerHTML = `<div class="page-heading"><div><h1>Player consistency</h1><p class="subtitle">20 most consistent players, 10 categories · pregame data only · ${esc(C.version)} (rules ${esc(C.rules_id)})</p></div>${badge('Research · not bets','research')}</div>
      ${kpis()}${filters()}<div id="cs-body">${body()}</div>`;
  }
  const body = () => leaderboard() + analysis() + deepDive() + tonight() + results();
  const refresh = () => { const b = document.getElementById('cs-body'); if (b) b.innerHTML = body(); };

  function bind() {
    view.addEventListener('click', e => {
      if (!document.getElementById('cs-body')) return;
      const t = e.target.closest('[data-cs-sort],[data-cs-player],[data-cs-mode],[data-cs-chart]');
      if (!t) return;
      if (t.dataset.csSort) { const k = t.dataset.csSort; state.dir = state.sort === k ? -state.dir : 1; state.sort = k; refresh(); }

    document.getElementById('props-count').textContent=`${rows.length} projection${rows.length===1?'':'s'} · ${players} player${players===1?'':'s'}`;
    document.getElementById('props-list').innerHTML=visible.map(propCard).join('')||empty(props.length?'No matching projections':'Player projections unavailable',state.filters.decision==='BET'&&gatePending()?'Calibration is pending. Choose All projections to explore research observations.':props.length?'Try another player, game, stat or book.':'Awaiting the next current-slate prediction refresh.');
    document.getElementById('props-more').innerHTML=rows.length>state.limit?`<button type="button" class="button load-more" data-action="more-props">Show 25 more (${visible.length} of ${rows.length})</button>`:'';
  }
  function chart(rows) {
    const byDay=new Map();for(const r of rows) byDay.set(r.date,(byDay.get(r.date)||0)+Number(r.profit_units||0));
    const daily=[...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
    if(!daily.length)return '<p class="small muted">The chart appears when priced BET results are available.</p>';
    let cumulative=0;const values=[0,...daily.map(([,profit])=>cumulative+=profit)];
    const low=Math.min(0,...values),high=Math.max(1,...values),x=i=>30+i/(values.length-1)*560,y=v=>115-(v-low)/(high-low)*90;
    const path=values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<svg class="chart" viewBox="0 0 620 150" role="img" aria-label="Cumulative flat one-unit forward-test profit ${esc(signed(cumulative,2))} units"><line class="chart-zero" x1="30" x2="590" y1="${y(0)}" y2="${y(0)}"/><path class="chart-line" d="${path}"/><text class="chart-label" x="30" y="142">${esc(daily[0][0].slice(5))}</text><text class="chart-label" x="590" y="142" text-anchor="end">${esc(daily[daily.length-1][0].slice(5))}</text><text class="chart-label" x="590" y="16" text-anchor="end">${esc(signed(cumulative,2))}u</text></svg>`;
  }
  function modelStatus() {
    const evidence=D.readiness?.forward_evidence||{}, policy=D.readiness?.promotion_policy||{}, calibration=D.calibration?.markets?.prop_price||{};
    return `<details id="model-status" class="model-status"><summary>Model status &amp; validation</summary><p>Current model evidence is tracked separately from the historical forward-test record.</p>${progress('Current priced BETs',evidence.bet_rows,policy.min_forward_bets||200)}${progress('Current prop BETs',evidence.prop_bets,policy.min_prop_forward_bets||100)}${progress('Matched closing lines',evidence.clv_matched,policy.min_matched_closes||100)}<p>Calibration observations: ${fmt(calibration.graded||0,0)}. Validation uses earlier dates for fitting and later dates for testing.</p>${calibration.validation==='INSUFFICIENT_DATED_EVIDENCE'?`${progress('Graded dates for the current model',calibration.dated_evidence_dates,calibration.min_dated_evidence_dates||5)}<p class="small muted">The training/holdout split starts once the current model has ${fmt(calibration.min_dated_evidence_dates||5,0)} graded dates${numeric(calibration.dated_evidence_dates)?` (it has ${fmt(calibration.dated_evidence_dates,0)})`:''}. A retrain that changes the model starts this count over, so evidence from different models is never mixed.</p>`:`${progress('Calibration training observations',calibration.training_rows,D.calibration?.min_graded||200)}${progress('Calibration holdout observations',calibration.holdout_rows,50)}`}<p>Data: ${esc(D.readiness?.data_model_healthy?'Ready':'Awaiting healthy inputs')} · Grading: ${esc((D.reconciliation?.status||'Unknown').toLowerCase())}</p></details>`;
  }

  function renderDiagnostics() {
    const report=D.yesterday_diagnostics||{}, sums=report.summary||{}, trailing=D.trailing_diagnostics||{};
    if(report.status!=='COMPLETE'&&report.status!=='PARTIAL_RESULTS')
      return '<section class="panel"><h2>Yesterday · model vs market</h2><p class="small muted">Waiting for dated, final box scores and pregame forecasts.</p></section>';
    const statRows=['PTS','REB','AST','THREES','PRA','MINUTES'].map(key=>{
      const r=report.stats?.[key]||{};
      return `<tr><td>${esc(key)}</td><td>${esc(fmt(r.sample,0))}</td><td>${esc(fmt(r.mae,2))}</td><td>${r.priced_directions?`${esc(fmt(r.directions_correct,0))}/${esc(fmt(r.priced_directions,0))}`:'—'}</td></tr>`;
    }).join('');
    const gameRows=(report.games||[]).map(g=>`<tr><td>${esc(g.game)}</td><td>${esc(fmt(g.model_margin))} / ${esc(fmt(g.actual_margin))}</td><td>${esc(fmt(g.model_total))} / ${esc(fmt(g.actual_total))}</td></tr>`).join('');
    const beatsMarket=numeric(sums.margin_mae_model)&&numeric(sums.margin_mae_market)
      ?Number(sums.margin_mae_model)<Number(sums.margin_mae_market):false;
    return `<section class="panel"><h2>Yesterday · model vs market ${badge('Research only','research')}</h2><p class="subtitle">${esc(dayLabel(report.date))} · ${esc(fmt(sums.completed_games,0))} final games of ${esc(fmt(sums.scheduled_games,0))}. No research lean is counted as a bet.</p><div class="detail-metrics" style="margin-top:16px">${metric('Winner calls',fmt(sums.winner_correct,0)+'/'+fmt(sums.winner_sample,0))}${metric('Spread MAE · model',fmt(sums.margin_mae_model,2))}${metric('Spread MAE · book',fmt(sums.margin_mae_market,2))}${metric('Total MAE · model',fmt(sums.total_mae_model,2))}${metric('Total MAE · book',fmt(sums.total_mae_market,2))}</div><p class="snapshot-note">${beatsMarket?'Model beat the posted spread benchmark this day.':'Book spread benchmark matched or beat the model this day.'} Shadow spread (35% model + 65% book): ${esc(fmt(sums.margin_mae_shadow,2))} MAE. Shadow forecasts are not approved betting lines.</p>${trailing.completed_games?`<p class="snapshot-note">Trailing ${esc(fmt(trailing.lookback_days,0))}-day window · ${esc(fmt(trailing.completed_games,0))} completed games: spread MAE model ${esc(fmt(trailing.margin_mae_model,2))}, market ${esc(fmt(trailing.margin_mae_market,2))}, shadow ${esc(fmt(trailing.margin_mae_shadow,2))}. Total MAE model ${esc(fmt(trailing.total_mae_model,2))}, market ${esc(fmt(trailing.total_mae_market,2))}.</p>`:''}<details class="details-link"><summary>Game-by-game actuals and prop accuracy</summary><div class="details-content"><table class="quote-table"><thead><tr><th>Game</th><th>Margin model / final</th><th>Total model / final</th></tr></thead><tbody>${gameRows}</tbody></table><p class="review-heading">Player stat forecast error</p><table class="quote-table"><thead><tr><th>Market</th><th>Players</th><th>MAE</th><th>Direction</th></tr></thead><tbody>${statRows}</tbody></table></div></details></section>`;
  }
  function pickRecord(r) {
    if(!r||!r.bets) return null;
    return [esc(fmt(r.bets,0)),esc(`${r.model_wins}–${r.model_losses}`),esc(pct(r.model_win_rate)),`${esc(signed(r.follow_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.follow_roi*100,1))}%</span>`,`${esc(signed(r.fade_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.fade_roi*100,1))}%</span>`];
  }
  function gameHistory(rows) {
    if(!rows||!rows.length) return '';
    const mark=(label,v)=>v===true?badge(label+' ✓','bet'):v===false?badge(label+' ✗','warning'):'';
    const body=rows.slice(0,60).map(r=>`<tr><td><strong>${esc(r.game)}</strong><br><span class="small muted">${esc(dayLabel(r.date))} · ${esc(r.phase==='EARLY'?'Early':'Adjusted')}</span></td><td>Model ${esc(r.pred_winner)} by ${esc(fmt(Math.abs(r.pred_home_margin)))}<br><span class="small muted">Won: ${esc(r.winner)} · line ${esc(signed(r.market_home_line,1))} · total ${esc(fmt(r.pred_total))} vs ${esc(fmt(r.market_total))}, actual ${esc(fmt(r.total,0))}</span></td><td>${mark('Winner',r.winner_right)}<br>${mark('Spread',r.ats_right)}<br>${mark('Total',r.ou_right)}</td></tr>`).join('');
    return `<details class="details-link"><summary>Graded game predictions (${fmt(rows.length,0)})</summary><div class="table-wrap"><table class="quote-table"><thead><tr><th>Game</th><th>Prediction</th><th>Result</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
  }
  function phaseTable(P) {
    if(!P||!(P.EARLY?.games||P.ADJUSTED?.games)) return '<p class="small muted">Early (morning) and adjusted (after the injury report) game predictions are graded separately once both have been recorded.</p>';
    const r=x=>x&&x.rate!=null?`${x.wins}–${x.losses} (${pct(x.rate)})`:'—';
    const line=(label,p)=>p&&p.games?`<tr><td>${esc(label)}</td><td>${esc(fmt(p.games,0))}</td><td>${esc(r(p.winner))}</td><td>${esc(r(p.ats))}</td><td>${esc(r(p.ou))}</td><td>${esc(fmt(p.margin_mae,1))}</td><td>${esc(fmt(p.total_mae,1))}</td></tr>`:`<tr><td>${esc(label)}</td><td colspan="6" class="muted">Not graded yet</td></tr>`;
    const c=P.changes;
    return `<h3 class="review-heading">Early vs adjusted (after the injury report)</h3><div class="table-wrap"><table class="quote-table"><thead><tr><th>Phase</th><th>Games</th><th>Winner</th><th>ATS</th><th>O/U</th><th>Margin miss</th><th>Total miss</th></tr></thead><tbody>${line('Early',P.EARLY)}${line('Adjusted',P.ADJUSTED)}</tbody></table></div>${c?`<p class="small muted">Adjusted pass moved the spread in ${fmt(c.spread_moved,0)} of ${fmt(c.games_with_both,0)} games (avg ${fmt(c.mean_spread_move,1)} pts), the total in ${fmt(c.total_moved,0)} (avg ${fmt(c.mean_total_move,1)}), and flipped the winner ${fmt(c.winner_flipped,0)} times.</p>`:''}`;
  }
  function gamePredictionResults() {
    const G=D.game_predictions||{};
    if(!G.games) return '';
    const w=G.winner||{}, e=G.error||{};
    const row=(label,r)=>r&&r.games?`<tr><td>${esc(label)}</td><td>${esc(fmt(r.games,0))}</td><td>${esc(`${r.model_wins}–${r.model_losses}`)}</td><td>${esc(pct(r.model_win_rate))}</td><td>${esc(signed(r.follow_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.follow_roi*100,1))}%</span></td><td>${esc(signed(r.fade_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.fade_roi*100,1))}%</span></td></tr>`:`<tr><td>${esc(label)}</td><td colspan="5" class="muted">No graded games yet</td></tr>`;
    return `<section class="panel"><h2 class="inline-title">Game predictions</h2><p class="subtitle">${esc(fmt(G.games,0))} regular-season games, ${esc(G.first_date||'')} to ${esc(G.last_date||'')}. Every game the model projected, not only qualified bets.</p>
      <div class="detail-metrics">${metric('Winner · model',`${w.model_wins}–${w.model_losses} (${pct(w.model_rate)})`,true)}${metric('Winner · market favorite',w.games_with_market_line?`${w.market_favorite_wins}–${w.market_favorite_losses} (${pct(w.market_favorite_rate)})`:'—')}${metric('Margin miss (avg)',`${fmt(e.model_margin_mae,1)} pts`)}${metric('Total miss · model vs line',`${fmt(e.model_total_mae,1)} vs ${fmt(e.market_total_mae,1)}`)}</div>
      <div class="table-wrap"><table class="quote-table"><thead><tr><th>Market</th><th>Games</th><th>Model W–L</th><th>Model win %</th><th>Follow</th><th>Fade</th></tr></thead><tbody>${row('Spread (ATS)',G.spread)}${row('Total (O/U)',G.total)}</tbody></table></div>
      ${phaseTable(G.phases)}${gameHistory(G.phases?.history)}
      <p class="small muted">Spread and total records use the model\u2019s side at the recorded sportsbook price (follow) and the other side\u2019s price (fade); break-even is about 52.4% at \u2212110. Qualified bets so far: spread ${esc(G.spread?.qualified_bets||'0-0')}, total ${esc(G.total?.qualified_bets||'0-0')}.</p></section>`;
  }
  function pickHistory(rows) {
    if(!rows||!rows.length) return '';
    const body=rows.slice(0,60).map(r=>`<tr><td><strong>${esc(r.player)}</strong><br><span class="small muted">${esc(dayLabel(r.date))} · ${esc(r.phase==='EARLY'?'Early':'Adjusted')}</span></td><td>${esc(statName(r.stat))} ${esc(String(r.side||'').toLowerCase())} ${esc(fmt(r.line))}<br><span class="small muted">${esc(shortBook(r.book_key))} ${esc(odds(r.odds))} · fade ${esc(odds(r.opp_odds))} · actual ${esc(fmt(r.actual))}</span></td><td>${badge(r.outcome==='WIN'?'Win':'Loss',r.outcome==='WIN'?'bet':'warning')}<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.follow_units,2))}u · fade ${esc(signed(r.fade_units,2))}u</span></td></tr>`).join('');
    return `<details class="details-link"><summary>Graded picks (${fmt(rows.length,0)})</summary><div class="table-wrap"><table class="quote-table"><thead><tr><th>Player</th><th>Pick</th><th>Result</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
  }
  function modelPickResults() {
    const R=D.data_bets||{};
    if(!R.retrospective_same_rule&&!R.phases) return '';
    const rows=[['Early picks',R.phases?.EARLY?.overall],['Adjusted picks',R.phases?.ADJUSTED?.overall],
      ['Data bets (ledger)',R.live?.overall],['Same rule, earlier dates',R.retrospective_same_rule?.overall]];
    const head='<thead><tr><th>Group</th><th>Picks</th><th>Model W–L</th><th>Model win %</th><th>Follow</th><th>Fade</th></tr></thead>';
    const body=rows.map(([label,r])=>{const v=pickRecord(r);return v?`<tr><td>${esc(label)}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`:`<tr><td>${esc(label)}</td><td colspan="5" class="muted">No graded picks yet</td></tr>`;}).join('');
    const best=[R.phases?.ADJUSTED,R.phases?.EARLY,R.live,R.retrospective_same_rule].find(x=>x?.overall?.bets>=20)||R.retrospective_same_rule||{};
    const statRows=Object.entries(best.by_stat||{}).map(([k,r])=>{const v=pickRecord(r);return v?`<tr><td>${esc(statName(k))}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`:'';}).join('');
    const ch=R.phase_changes||{};
    const changes=ch.dates_with_both?`<p class="small muted">After the injury report the adjusted pass kept ${fmt(ch.kept_same_side,0)} early picks, flipped ${fmt(ch.flipped_side,0)} and dropped ${fmt(ch.dropped_after_report,0)} (${fmt(ch.dates_with_both,0)} dates).</p>`:'';
    return `<section class="panel"><h2 class="inline-title">Model picks · follow vs fade</h2><p class="subtitle">The model\u2019s 10 strongest prop opinions a day, flat 1u, graded at the recorded price (follow) and at the opposite side\u2019s price at the same book and line (fade).</p><div class="table-wrap"><table class="quote-table">${head}<tbody>${body}</tbody></table></div>${statRows?`<h3 class="review-heading">By stat · ${esc(best===R.retrospective_same_rule?'same rule, earlier dates':'largest graded group')}</h3><div class="table-wrap"><table class="quote-table">${head.replace('Group','Stat')}<tbody>${statRows}</tbody></table></div>`:''}${changes}${pickHistory(R.graded_picks)}<p class="small muted">Fading pays only if the model\u2019s side wins less than about 47.6% at \u2212110 both ways. Earlier-dates rows apply today\u2019s rule to props recorded before it existed; they were not issued as picks at the time.</p></section>`;
  }
  function renderResults() {
    const perf=D.forward_performance||{}, clv=D.clv_report||{}, rows=D.results||[];
    const record=numeric(perf.hit_rate)?`${perf.wins||0}–${perf.losses||0}`:'—';
    const stats=[['Record',record],['Hit rate',pct(perf.hit_rate)],['Flat 1u profit',signed(perf.profit_units,2)+'u'],['ROI',pct(perf.roi)]];
    const days=[...new Set(rows.map(r=>r.date))].sort().reverse();
    view.innerHTML=heading('Results','Historical forward test · priced BET decisions only.',badge('Recorded prices','research'))+`<div class="results-grid">${stats.map(([label,value])=>`<div class="result-stat">${metric(label,value)}</div>`).join('')}</div>${gamePredictionResults()}${modelPickResults()}${renderDiagnostics()}<div class="results-layout"><section class="panel"><h2 class="inline-title">Flat 1u test performance</h2>${chart(rows)}<p class="snapshot-note">Each graded bet risks 1u at its recorded sportsbook price. Consensus-priced game entries are excluded.</p></section><section class="panel"><h2 class="inline-title">Closing-line evidence</h2><p class="subtitle">Did the entry beat the same sportsbook’s closing quote?</p><div class="detail-metrics" style="margin-top:16px">${metric('Matched',fmt(clv.matched_closes||0,0))}${metric('Beat close',pct(clv.beat_close_rate))}${metric('Line CLV',fmt(clv.avg_line_clv,2))}</div><p class="small muted">Pending observations: ${fmt(perf.pending_rows||0,0)}<br>Excluded unpriced BET entries: ${fmt(perf.excluded_unpriced_bets||0,0)}</p></section></div><section class="panel">${modelStatus()}</section><div class="section-heading"><h2>Graded bet history</h2><span class="small muted">${rows.length} results</span></div><section class="filters"><div class="filter-grid"><label for="result-date">Date<select id="result-date">${options([['','All graded dates'],[D.yesterday,'Yesterday · '+dayLabel(D.yesterday)],...days.filter(d=>d!==D.yesterday).map(d=>[d,dayLabel(d)])],state.resultDate)}</select></label><label for="result-book">Sportsbook<select id="result-book">${options([['','All books'],...['fanduel','draftkings','fanatics','novig'].map(b=>[b,bookName(b)])],state.resultBook)}</select></label><label for="result-outcome">Outcome<select id="result-outcome">${options([['','All outcomes'],['WIN','Win'],['LOSS','Loss'],['PUSH','Push']],state.resultOutcome)}</select></label></div></section><section class="panel" id="result-history"></section>`;
    renderResultRows();
  }
  function renderResultRows() {
    const rows=(D.results||[]).filter(r=>(!state.resultDate||r.date===state.resultDate)&&(!state.resultBook||r.sportsbook_key===state.resultBook)&&(!state.resultOutcome||r.outcome===state.resultOutcome));
    document.getElementById('result-history').innerHTML=rows.map(r=>`<article class="result-row"><div><strong>${esc(r.player?`${r.player} · ${r.stat} ${r.side} ${fmt(r.line)}`:`${r.game} · ${r.market} ${r.side} ${fmt(r.line)}`)}</strong><p class="subtitle">${esc(dayLabel(r.date))} · ${esc(bookName(r.sportsbook_key))} ${esc(odds(r.odds))} · Actual ${esc(fmt(r.actual))}</p></div><div><span class="badge ${r.outcome==='WIN'?'bet':''}">${esc(r.outcome)}</span><div class="small ${r.outcome.toLowerCase()}">${esc(signed(r.profit_units,2))}u</div></div></article>`).join('')||empty('No priced BET results for this filter','Research observations and excluded consensus entries do not count as graded bets.');
  }
  function renderConsistency() {
    if(window.Consistency)window.Consistency.open(view);else view.innerHTML=empty('Player consistency unavailable','The consistency module did not load.');
  }
  function renderTab(tab,focus=false) {
    state.tab=tab;
    for(const button of document.querySelectorAll('[data-tab]')){const selected=button.dataset.tab===tab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;}
    view.setAttribute('aria-labelledby','tab-'+tab);
    ({today:renderToday,games:renderGames,props:renderProps,results:renderResults,consistency:renderConsistency}[tab]||renderToday)();
    window.scrollTo({top:0,behavior:'instant'});
    if(focus)view.focus({preventScroll:true});
  }
  document.addEventListener('click',event=>{
    const control=event.target.closest('[data-tab],[data-action]');if(!control)return;
    if(control.dataset.tab){renderTab(control.dataset.tab);return;}
    switch(control.dataset.action){
      case 'view-props':renderTab('props',true);break;
      case 'view-games':state.game='';renderTab('games',true);break;
      case 'linemate-review':state.game='';renderTab('games',true);document.querySelector('.more-menu').open=false;const review=document.querySelector('.linemate-review');if(review){review.open=true;review.scrollIntoView({block:'start'});}break;
      case 'game-props':state.filters.game=games[Number(control.dataset.gameIndex)]?.display_name||'';state.filters.search='';state.limit=25;renderTab('props',true);break;
      case 'player-props':state.filters={search:control.dataset.player||'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderTab('props',true);break;
      case 'reset-filters':state.filters={search:'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderProps();document.getElementById('player-search').focus();break;
      case 'more-props':state.limit+=25;renderPropRows();break;
      case 'v2-lab':document.querySelector('.more-menu').open=false;if(window.V2Lab)window.V2Lab.open(view);break;
      case 'model-status':renderTab('results',true);document.querySelector('.more-menu').open=false;document.getElementById('model-status').open=true;document.getElementById('model-status').scrollIntoView({block:'center'});break;
    }
  });
  document.addEventListener('input',event=>{if(event.target.id==='player-search'){state.filters.search=event.target.value;state.limit=25;renderPropRows();}});
  document.addEventListener('change',event=>{
    const id=event.target.id;
    if(id.startsWith('filter-')){state.filters[id.slice(7)]=event.target.value;state.limit=25;if(id==='filter-stat'){if(!state.filters.stat&&state.filters.sort==='gap')state.filters.sort='player';renderProps();}else renderPropRows();}
    if(id==='game-select'){state.game=event.target.value;renderGames();}
    if(id==='result-date'){state.resultDate=event.target.value;renderResultRows();}
    if(id==='result-book'){state.resultBook=event.target.value;renderResultRows();}
    if(id==='result-outcome'){state.resultOutcome=event.target.value;renderResultRows();}
  });
  document.querySelector('.tabs').addEventListener('keydown',event=>{
    const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;
    const tabs=[...document.querySelectorAll('[data-tab]')], index=tabs.indexOf(document.activeElement);if(index<0)return;
    event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    renderTab(tabs[next].dataset.tab);tabs[next].focus();
  });
  freshness();renderTab('today');
}());
</script>
</body>
</html>
