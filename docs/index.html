ecision rules. Verify the current book line and price.'):gatePending()?'Calibration pending. The gap is a projection comparison; this is a research observation.':'This observation did not pass all qualification rules.'}</p>${row.decision==='BET'?`<p class="small">Recorded model probability ${esc(pct(row.model_probability))} · EV ${esc(pct(row.ev))}</p>`:''}${propComparison(row)}<p class="small muted">Compare recent form, home/away and teammate splits in <a href="${esc(window.LinemateReview?linematePropUrl(row):'https://linemate.io/nba')}" target="_blank" rel="noopener noreferrer">Linemate ↗</a>. Save observations under this matchup in Games.</p></div></details>`;

  function chart(rows) {
    const byDay=new Map();for(const r of rows) byDay.set(r.date,(byDay.get(r.date)||0)+Number(r.profit_units||0));

    if(!daily.length)return '<p class="small muted">The chart appears when priced BET results are available.</p>';
    let cumulative=0;const values=[0,...daily.map(([,profit])=>cumulative+=profit)];
    const low=Math.min(0,...values),high=Math.max(1,...values),x=i=>30+i/(values.length-1)*560,y=v=>115-(v-low)/(high-low)*90;
    const path=values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<svg class="chart" viewBox="0 0 620 150" role="img" aria-label="Cumulative flat one-unit forward-test profit ${esc(signed(cumulative,2))} units"><line class="chart-zero" x1="30" x2="590" y1="${y(0)}" y2="${y(0)}"/><path class="chart-line" d="${path}"/><text class="chart-label" x="30" y="142">${esc(daily[0][0].slice(5))}</text><text class="chart-label" x="590" y="142" text-anchor="end">${esc(daily[daily.length-1][0].slice(5))}</text><text class="chart-label" x="590" y="16" text-anchor="end">${esc(signed(cumulative,2))}u</text></svg>`;
  }

    const w=G.winner||{}, e=G.error||{};
    const row=(label,r)=>r&&r.games?`<tr><td>${esc(label)}</td><td>${esc(fmt(r.games,0))}</td><td>${esc(`${r.model_wins}–${r.model_losses}`)}</td><td>${esc(pct(r.model_win_rate))}</td><td>${esc(signed(r.follow_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.follow_roi*100,1))}%</span></td><td>${esc(signed(r.fade_units,1))}u<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.fade_roi*100,1))}%</span></td></tr>`:`<tr><td>${esc(label)}</td><td colspan="5" class="muted">No graded games yet</td></tr>`;
    return `<section class="panel"><h2 class="inline-title">Game predictions</h2><p class="subtitle">${esc(fmt(G.games,0))} regular-season games, ${esc(G.first_date||'')} to ${esc(G.last_date||'')}. Every game the model projected, not only qualified bets.</p>
      <div class="detail-metrics">${metric('Winner · model',`${w.model_wins}–${w.model_losses} (${pct(w.model_rate)})`,true)}${metric('Winner · market favorite',w.games_with_market_line?`${w.market_favorite_wins}–${w.market_favorite_losses} (${pct(w.market_favorite_rate)})`:'—')}${metric('Margin miss (avg)',`${fmt(e.model_margin_mae,1)} pts`)}${metric('Total miss · model vs line',`${fmt(e.model_total_mae,1)} vs ${fmt(e.market_total_mae,1)}`)}</div>
      <div class="table-wrap"><table class="quote-table"><thead><tr><th>Market</th><th>Games</th><th>Model W–L</th><th>Model win %</th><th>Follow</th><th>Fade</th></tr></thead><tbody>${row('Spread (ATS)',G.spread)}${row('Total (O/U)',G.total)}</tbody></table></div>
      ${phaseTable(G.phases)}${gameHistory(G.phases?.history)}
      <p class="small muted">Spread and total records use the model\u2019s side at the recorded sportsbook price (follow) and the other side\u2019s price (fade); break-even is about 52.4% at \u2212110. Qualified bets so far: spread ${esc(G.spread?.qualified_bets||'0-0')}, total ${esc(G.total?.qualified_bets||'0-0')}.</p></section>`;
  }
  function pickHistory(rows) {
    if(!rows||!rows.length) return '';
    const body=rows.slice(0,60).map(r=>`<tr><td><strong>${esc(r.player)}</strong><br><span class="small muted">${esc(dayLabel(r.date))} · ${esc(r.phase==='EARLY'?'Early':'Adjusted')}</span></td><td>${esc(statName(r.stat))} ${esc(String(r.side||'').toLowerCase())} ${esc(fmt(r.line))}<br><span class="small muted">${esc(shortBook(r.book_key))} ${esc(odds(r.odds))} · fade ${esc(odds(r.opp_odds))} · actual ${esc(fmt(r.actual))}</span></td><td>${badge(r.outcome==='WIN'?'Win':'Loss',r.outcome==='WIN'?'bet':'warning')}<br><span class="small muted" style="white-space:nowrap">${esc(signed(r.follow_units,2))}u · fade ${esc(signed(r.fade_units,2))}u</span></td></tr>`).join('');
    return `<details class="details-link"><summary>Graded picks (${fmt(rows.length,0)})</summary><div class="table-wrap"><table class="quote-table"><thead><tr><th>Player</th><th>Pick</th><th>Result</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
  }
  function modelPickResults() {
    const R=D.data_bets||{};
    if(!R.retrospective_same_rule&&!R.phases) return '';
    const rows=[['Early picks',R.phases?.EARLY?.overall],['Adjusted picks',R.phases?.ADJUSTED?.overall],
      ['Data bets (ledger)',R.live?.overall],['Same rule, earlier dates',R.retrospective_same_rule?.overall]];
    const head='<thead><tr><th>Group</th><th>Picks</th><th>Model W–L</th><th>Model win %</th><th>Follow</th><th>Fade</th></tr></thead>';
    const body=rows.map(([label,r])=>{const v=pickRecord(r);return v?`<tr><td>${esc(label)}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`:`<tr><td>${esc(label)}</td><td colspan="5" class="muted">No graded picks yet</td></tr>`;}).join('');
    const best=[R.phases?.ADJUSTED,R.phases?.EARLY,R.live,R.retrospective_same_rule].find(x=>x?.overall?.bets>=20)||R.retrospective_same_rule||{};
    const statRows=Object.entries(best.by_stat||{}).map(([k,r])=>{const v=pickRecord(r);return v?`<tr><td>${esc(statName(k))}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`:'';}).join('');
    const ch=R.phase_changes||{};
    const changes=ch.dates_with_both?`<p class="small muted">After the injury report the adjusted pass kept ${fmt(ch.kept_same_side,0)} early picks, flipped ${fmt(ch.flipped_side,0)} and dropped ${fmt(ch.dropped_after_report,0)} (${fmt(ch.dates_with_both,0)} dates).</p>`:'';
    return `<section class="panel"><h2 class="inline-title">Model picks · follow vs fade</h2><p class="subtitle">The model\u2019s 10 strongest prop opinions a day, flat 1u, graded at the recorded price (follow) and at the opposite side\u2019s price at the same book and line (fade).</p><div class="table-wrap"><table class="quote-table">${head}<tbody>${body}</tbody></table></div>${statRows?`<h3 class="review-heading">By stat · ${esc(best===R.retrospective_same_rule?'same rule, earlier dates':'largest graded group')}</h3><div class="table-wrap"><table class="quote-table">${head.replace('Group','Stat')}<tbody>${statRows}</tbody></table></div>`:''}${changes}${pickHistory(R.graded_picks)}<p class="small muted">Fading pays only if the model\u2019s side wins less than about 47.6% at \u2212110 both ways. Earlier-dates rows apply today\u2019s rule to props recorded before it existed; they were not issued as picks at the time.</p></section>`;
  }
  function renderResults() {
    const perf=D.forward_performance||{}, clv=D.clv_report||{}, rows=D.results||[];
    const record=numeric(perf.hit_rate)?`${perf.wins||0}–${perf.losses||0}`:'—';
    const stats=[['Record',record],['Hit rate',pct(perf.hit_rate)],['Flat 1u profit',signed(perf.profit_units,2)+'u'],['ROI',pct(perf.roi)]];
    const days=[...new Set(rows.map(r=>r.date))].sort().reverse();
    view.innerHTML=heading('Results','Historical forward test · priced BET decisions only.',badge('Recorded prices','research'))+`<div class="results-grid">${stats.map(([label,value])=>`<div class="result-stat">${metric(label,value)}</div>`).join('')}</div>${gamePredictionResults()}${modelPickResults()}${renderDiagnostics()}<div class="results-layout"><section class="panel"><h2 class="inline-title">Flat 1u test performance</h2>${chart(rows)}<p class="snapshot-note">Each graded bet risks 1u at its recorded sportsbook price. Consensus-priced game entries are excluded.</p></section><section class="panel"><h2 class="inline-title">Closing-line evidence</h2><p class="subtitle">Did the entry beat the same sportsbook’s closing quote?</p><div class="detail-metrics" style="margin-top:16px">${metric('Matched',fmt(clv.matched_closes||0,0))}${metric('Beat close',pct(clv.beat_close_rate))}${metric('Line CLV',fmt(clv.avg_line_clv,2))}</div><p class="small muted">Pending observations: ${fmt(perf.pending_rows||0,0)}<br>Excluded unpriced BET entries: ${fmt(perf.excluded_unpriced_bets||0,0)}</p></section></div><section class="panel">${modelStatus()}</section><div class="section-heading"><h2>Graded bet history</h2><span class="small muted">${rows.length} results</span></div><section class="filters"><div class="filter-grid"><label for="result-date">Date<select id="result-date">${options([['','All graded dates'],[D.yesterday,'Yesterday · '+dayLabel(D.yesterday)],...days.filter(d=>d!==D.yesterday).map(d=>[d,dayLabel(d)])],state.resultDate)}</select></label><label for="result-book">Sportsbook<select id="result-book">${options([['','All books'],...['fanduel','draftkings','fanatics','novig'].map(b=>[b,bookName(b)])],state.resultBook)}</select></label><label for="result-outcome">Outcome<select id="result-outcome">${options([['','All outcomes'],['WIN','Win'],['LOSS','Loss'],['PUSH','Push']],state.resultOutcome)}</select></label></div></section><section class="panel" id="result-history"></section>`;
    renderResultRows();
  }
  function renderResultRows() {
    const rows=(D.results||[]).filter(r=>(!state.resultDate||r.date===state.resultDate)&&(!state.resultBook||r.sportsbook_key===state.resultBook)&&(!state.resultOutcome||r.outcome===state.resultOutcome));
    document.getElementById('result-history').innerHTML=rows.map(r=>`<article class="result-row"><div><strong>${esc(r.player?`${r.player} · ${r.stat} ${r.side} ${fmt(r.line)}`:`${r.game} · ${r.market} ${r.side} ${fmt(r.line)}`)}</strong><p class="subtitle">${esc(dayLabel(r.date))} · ${esc(bookName(r.sportsbook_key))} ${esc(odds(r.odds))} · Actual ${esc(fmt(r.actual))}</p></div><div><span class="badge ${r.outcome==='WIN'?'bet':''}">${esc(r.outcome)}</span><div class="small ${r.outcome.toLowerCase()}">${esc(signed(r.profit_units,2))}u</div></div></article>`).join('')||empty('No priced BET results for this filter','Research observations and excluded consensus entries do not count as graded bets.');
  }
  function renderConsistency() {
    if(window.Consistency)window.Consistency.open(view);else view.innerHTML=empty('Player consistency unavailable','The consistency module did not load.');
  }
  function renderTab(tab,focus=false) {
    state.tab=tab;
    for(const button of document.querySelectorAll('[data-tab]')){const selected=button.dataset.tab===tab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;}
    view.setAttribute('aria-labelledby','tab-'+tab);
    ({today:renderToday,games:renderGames,props:renderProps,results:renderResults,consistency:renderConsistency}[tab]||renderToday)();
    window.scrollTo({top:0,behavior:'instant'});
    if(focus)view.focus({preventScroll:true});
  }
  document.addEventListener('click',event=>{
    const control=event.target.closest('[data-tab],[data-action]');if(!control)return;
    if(control.dataset.tab){renderTab(control.dataset.tab);return;}
    switch(control.dataset.action){
      case 'view-props':renderTab('props',true);break;
      case 'view-games':state.game='';renderTab('games',true);break;
      case 'linemate-review':state.game='';renderTab('games',true);document.querySelector('.more-menu').open=false;const review=document.querySelector('.linemate-review');if(review){review.open=true;review.scrollIntoView({block:'start'});}break;
      case 'game-props':state.filters.game=games[Number(control.dataset.gameIndex)]?.display_name||'';state.filters.search='';state.limit=25;renderTab('props',true);break;
      case 'player-props':state.filters={search:control.dataset.player||'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderTab('props',true);break;
      case 'reset-filters':state.filters={search:'',game:'',stat:'',book:'',direction:'',decision:'',sort:'player'};state.limit=25;renderProps();document.getElementById('player-search').focus();break;
      case 'more-props':state.limit+=25;renderPropRows();break;
      case 'v2-lab':document.querySelector('.more-menu').open=false;if(window.V2Lab)window.V2Lab.open(view);break;
      case 'model-status':renderTab('results',true);document.querySelector('.more-menu').open=false;document.getElementById('model-status').open=true;document.getElementById('model-status').scrollIntoView({block:'center'});break;
    }
  });
  document.addEventListener('input',event=>{if(event.target.id==='player-search'){state.filters.search=event.target.value;state.limit=25;renderPropRows();}});
  document.addEventListener('change',event=>{
    const id=event.target.id;
    if(id.startsWith('filter-')){state.filters[id.slice(7)]=event.target.value;state.limit=25;if(id==='filter-stat'){if(!state.filters.stat&&state.filters.sort==='gap')state.filters.sort='player';renderProps();}else renderPropRows();}
    if(id==='game-select'){state.game=event.target.value;renderGames();}
    if(id==='result-date'){state.resultDate=event.target.value;renderResultRows();}
    if(id==='result-book'){state.resultBook=event.target.value;renderResultRows();}
    if(id==='result-outcome'){state.resultOutcome=event.target.value;renderResultRows();}
  });
  document.querySelector('.tabs').addEventListener('keydown',event=>{
    const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;
    const tabs=[...document.querySelectorAll('[data-tab]')], index=tabs.indexOf(document.activeElement);if(index<0)return;
    event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    renderTab(tabs[next].dataset.tab);tabs[next].focus();
  });
  freshness();renderTab('today');
}());
</script>
</body>
</html>
